const GLOSS = [
{k:'noun', t:'noun', d:'A word that names — a person, place, thing, or idea: “Sinatra,” “bar,” “silence.” Nouns are what sentences are about, and what verbs act on.', ex:'“Gary Robinson died hungry.” — Edna Buchanan. “Gary Robinson” is the noun the sentence is about.'},
{k:'adjective', t:'adjective', d:'A word that describes a noun: a “dark” corner, “fading” blondes. It adds to the noun without making a new statement.', ex:'“It was a bright cold day in April, and the clocks were striking thirteen.” — Orwell. “Bright” and “cold” are adjectives on “day.”'},
{k:'adverb', t:'adverb', d:'A word that describes a verb, an adjective, or a whole sentence — how, when, how much: “slowly,” “never,” “certainly.” Fronted with a comma (“Certainly, …”), it sets the stance of everything that follows.', ex:'“Certainly, he had a point about Strauss’s remorseless performance of ‘Death and Transfiguration.’” — Ross. “Certainly” is an adverb, set in front of the whole sentence.'},
{k:'pronoun', t:'pronoun', d:'A word that stands in for a noun — he, she, it, they, who, that. Every pronoun points back at something.', ex:'“We smile when we see him, we laugh before he does anything; it makes us happy just to look at him.” — Kael. “We,” “him,” and “it” are pronouns; “him” is Cary Grant, the subject of the piece.'},
{k:'antecedent', t:'antecedent', d:'The noun a pronoun points back to. From Latin ante + cedere, “going before” — the antecedent usually goes before its pronoun. When it doesn’t, or when two nouns compete for the job, the pronoun wobbles.', ex:'“He is like a God who spends four hours on the shading on Eve’s upper lip, forgets to give her a clitoris.” — Lockwood. “Who” points back to “a God,” its antecedent.'},
{k:'article', t:'article', d:'The smallest words in the language: a, an, the. “The” points at a known one, “a” at any one. Headlines drop them — and dropping one can change the meaning: Armstrong needed “one small step for A man.”', ex:'“MEN WALK ON MOON” — The New York Times front page, with every “the” stripped out, as headlines do.'},
{k:'preposition', t:'preposition', d:'A small word that ties a noun into the sentence by relation — in, on, at, of, with, between, through. It opens a prepositional phrase — “in a dark corner” — that describes whatever it attaches to.', ex:'“The man came to the village on a moped.” — Finkel. “To” and “on” are prepositions, tying “village” and “moped” into the sentence.'},
{k:'conjunction', t:'joining word (conjunction)', d:'The seven small words that may hold two complete statements together with a comma: and, but, or, nor, for, so, yet. They also join list items. (“However” and “rather” are not on the list — those are pivot words.)', ex:'“It was a bright cold day in April, and the clocks were striking thirteen.” — Orwell. The “and,” with its comma, joins the two statements.'},
{k:'infinitive', t:'infinitive', d:'“To” plus a verb: to be, to know. It names the action without saying when, so it can’t make a statement. And it can act as a noun: in “to err is human,” “to err” is the subject — the thing that is human.', ex:'“To be, or not to be, that is the question” — Hamlet. The subject is two infinitives.'},
{k:'sentence', t:'sentence', d:'Tells you that someone or something did something, and closes with a period. At minimum: a subject and a verb.', ex:'“Gary Robinson died hungry.” — Edna Buchanan. Subject, verb, period: a complete sentence in four words.'},
{k:'subject', t:'subject', d:'Who or what the sentence is about — the doer of the verb.', ex:'“Gary Robinson died hungry.” — Edna Buchanan. The subject is “Gary Robinson.”'},
{k:'verb', t:'verb', d:'The word that says what happened and when: died, is, stood. Every complete statement needs one.', ex:'“Gary Robinson died hungry.” — Edna Buchanan. The verb is “died.”'},
{k:'predicate', t:'predicate', d:'The verb plus everything attached to it — the half of the sentence that says what happened. Subject | predicate: “Gary Robinson | died hungry.”', ex:'“Gary Robinson died hungry.” — Edna Buchanan. Subject: “Gary Robinson.” Predicate: “died hungry.”'},
{k:'object', t:'object', d:'The noun on the receiving end of the verb. The subject does; the object is done to.', ex:'“Call me Ishmael.” — Melville. “Me” is the object of “call.”'},
{k:'phrase', t:'phrase', d:'A group of words that works as one unit but has no subject-verb pair of its own — that is what separates it from a clause.', ex:'“Frank Sinatra, holding a glass of bourbon in one hand and a cigarette in the other, stood in a dark corner of the bar between two attractive but fading blondes who sat waiting for him to say something.” — Talese. “Holding a glass of bourbon in one hand” is a phrase: one unit, no subject-verb pair.'},
{k:'imperative', t:'imperative', d:'A command. The verb comes first and the subject — you — goes unsaid.', ex:'“Call me Ishmael.” — Melville. Verb first, the subject (you) unsaid. Likewise “DROP DEAD” — Daily News.'},
{k:'tense', t:'tense', d:'What the verb says about when: past (“stood”), present (“saunters”), future (“will flash”). Profiles default to the past; any switch is a choice.', ex:'“He saunters out from shadows in the back of the stage, indistinguishable at first from the four other band members.” — Ross, on Bob Dylan. “Saunters” is present tense.'},
{k:'voice', t:'active & passive voice', d:'Active: the subject does the verb (“Buchanan covered the murder”). Passive: the subject is acted on (“the murder was covered”) — the doer can drop out entirely. Passive isn’t a sin; it decides who stands in the spotlight.', ex:'Active: “Edna Buchanan covered the murder for the Herald.” — Trillin. Passive would be “the murder was covered” — the doer can drop out entirely.'},
{k:'directaddress', t:'direct address', d:'Naming the person you are speaking to, set off by a comma. The reader can be that person.', ex:'“Reader, I married him.” — Brontë, ending Jane Eyre. “Reader” is the person addressed.'},
{k:'statement', t:'complete statement (clause)', d:'A subject plus a verb that could stand alone as a sentence. Grammars call this a clause.', ex:'“We smile when we see him, we laugh before he does anything; it makes us happy just to look at him.” — Kael. Three free-standing statements: “we smile,” “we laugh,” “it makes us happy just to look at him.”'},
{k:'fragment', t:'fragment', d:'Less than a complete statement — no verb, or no subject — wearing a period. Sometimes an error, sometimes chosen — the sound of the last word.', ex:'“Penis with a thesaurus.” — David Foster Wallace on Updike, quoted by Lockwood. No verb: a fragment.'},
{k:'splice', t:'comma splice', d:'Two complete statements held together by only a comma. That job normally needs “and,” a semicolon, or a period. Writers sometimes do it on purpose, for speed.', ex:'“I can’t go on, I’ll go on.” — Beckett. Two complete statements, bare comma between them.'},
{k:'runon', t:'run-on', d:'Two complete statements with nothing at all between them — not even a comma.', ex:'Constructed, since the readings don’t have one: “He talked for an hour he never mentioned the record.”'},
{k:'semicolon', t:'semicolon', d:'Joins two complete statements without “and.” Second job: separates list items that have commas inside them.', ex:'“Happy families are all alike; every unhappy family is unhappy in its own way.” — Tolstoy. The semicolon holds the two statements in one sentence.'},
{k:'colon', t:'colon', d:'Needs a complete statement on its left. Then it delivers — a word, a list, or another statement.', ex:'“She’s a rare combination: a thin, long-limbed beauty with a trained analytic mind who dresses with cunning understatement.” — Buck. Complete statement, colon, delivery.'},
{k:'dash', t:'dash', d:'Joins or interrupts with a jolt; good for the held beat before a payoff, or for fencing off an aside too big for commas.', ex:'“Sinatra with a cold is Picasso without paint, Ferrari without fuel — only worse.” — Talese. The dash holds a beat before the last two words.'},
{k:'hyphen', t:'hyphen', d:'Glues words into one word. The opposite of the dash’s job: the dash separates; the hyphen fuses.', ex:'“In New York City, especially in Greenwich Village, down among the cranks and the misfits and the one-lungers and the has-beens and the might’ve-beens and the would-bes and the never-wills and the God-knows-whats, I have always felt at home.” — Joe Gould. Each hyphen glues a new noun together.'},
{k:'ellipsismark', t:'ellipsis (…)', d:'Three dots: words left out of a quotation, or a voice trailing off. Inside a quote it flags that something is missing — which is why this site quotes whole sentences.', ex:'“I wish Bob Dylan died. Then Channel 5 would piece together an instant documentary on his life and times. . . . Just the immutable facts.” — Jacobson. The dots are the original’s: the voice trailing off.'},
{k:'scarequotes', t:'scare quotes', d:'Quotation marks around a word nobody is actually quoting — the word held with tongs: their term, not mine.', ex:'“The naked woman on the ledge outside the window on the sixteenth floor is a victim of accidie, or the naked woman is an exhibitionist, and it would be ‘interesting’ to know which.” — Didion. The quotes hold “interesting” at arm’s length.'},
{k:'appositive', t:'appositive', d:'A phrase set beside a noun to rename it. No verb of its own, so it can never stand alone — and it’s often mistaken for a comma splice. Beside a person’s name it can carry a whole claim about them in one phrase — the profile writer’s appositive. (Latin ad + positus: “placed beside.”)', ex:'A rename of a place: “a courtyard in Riga, the capital of Latvia” — Acocella. A role beside a name: “alongside Sarah Larson, his girlfriend” — Parker. A whole claim, filed before the name arrives: “Dictator of a nation devoted to splendid sausages, cigars, beer, and babies, Adolf Hitler is a vegetarian, teetotaller, nonsmoker, and celibate.” — Flanner'},
{k:'participle', t:'participle', d:'A verb-form doing describing work. Two kinds: the -ing kind (“holding,” “preying”) and the past kind (“persuaded,” “borne”). In “Sinatra, holding a glass of bourbon, stood,” the verb is “stood” — it says when; “holding” never says when, so it can’t make a statement of its own — it hangs off “Sinatra” and describes him. (An -ing word used as a noun instead — “a piece of nonfiction writing” — is a gerund; the past kind never does that job.) From Latin particeps, “sharing”: it shares in being a verb and an adjective at once.', ex:'“He is a kind of confidence man, preying on people’s vanity, ignorance, or loneliness, gaining their trust and betraying them without remorse.” — Malcolm. “Preying,” “gaining,” “betraying”: participles describing “he.”'},
{k:'gerund', t:'gerund', d:'The other job an -ing word can do: be a noun. In “a piece of nonfiction writing,” “writing” names a thing; in “smoking is banned,” “smoking” is the subject. Describing a noun makes an -ing word a participle; being a noun makes it a gerund.', ex:'“Like the credulous widow who wakes up one day to find the charming young man and all her savings gone, so the consenting subject of a piece of nonfiction writing learns—when the article or book appears—his hard lesson.” — Malcolm. “Consenting” describes the subject (a participle); “writing” names a thing (a gerund).'},
{k:'pivotword', t:'pivot word (conjunctive adverb)', d:'However, rather, nevertheless, therefore: words that comment on a connection but can’t glue statements together with a comma. Safe at the start of a fresh sentence.', ex:'“Rather, it was a supremely cool crush — she walked through the world with the confidence of a woman who was not aspiring to have a man, even a superman, but like a woman who finally found a man who was worthy of her.” — Brodesser-Akner. “Rather” turns the sentence against the one before it.'},
{k:'pinned', t:'pinned clause (subordinate)', d:'Has its own subject and verb, but its first word — when, before, because, that — pins it to another statement, so it can’t stand alone.', ex:'“We smile when we see him, we laugh before he does anything; it makes us happy just to look at him.” — Kael. “When we see him” has its own subject and verb, but “when” pins it — it can’t stand alone.'},
{k:'restrictive', t:'restrictive vs. aside', d:'No commas: the clause narrows down which one (“the record that broke him”). With commas: the noun is already known and the clause is a liftable aside (“the record, which broke him,”).', ex:'“Every journalist who is not too stupid or too full of himself to notice what is going on knows that what he does is morally indefensible.” — Malcolm. No commas around the “who” clause: it narrows which journalists.'},
{k:'interjection', t:'interjection', d:'An exclamation parked outside the sentence, set off by a comma. (Latin inter + iacere: “thrown between.”)', ex:'“God, she could be insulting to people.” — Castle. “God” is the interjection.'},
{k:'compoundpred', t:'compound predicate', d:'One subject with a chain of verbs. The commas between the verbs are list commas, not joins — so it isn’t a splice chain.', ex:'“We interpret what we see, select the most workable of the multiple choices.” — Didion. One subject, two verbs: a compound predicate.'},
{k:'anaphora', t:'anaphora', d:'Sentences or phrases in a row opening with the same words — repetition as a drumbeat. (Greek: “a carrying back.”)', ex:'“It is more than Hank Williams, Sr., Johnny Cash, and Glen Campbell combined. It is more than George Jones, Hank Snow, and Ray Price combined.” — Di Salvatore. Both sentences open with the same words.'},
{k:'epistrophe', t:'epistrophe', d:'Ending several sentences or phrases on the same word — the mirror image of anaphora, where the openings repeat.', ex:'“It is more than Hank Williams, Sr., Johnny Cash, and Glen Campbell combined. It is more than George Jones, Hank Snow, and Ray Price combined.” — Di Salvatore. Both sentences end on “combined.”'},
{k:'asyndeton', t:'asyndeton', d:'Leaving out the “and” where you would expect one, letting a comma carry the join. It makes the list quick and clipped. (Greek: “unbound.”)', ex:'“We interpret what we see, select the most workable of the multiple choices.” — Didion. The “and” before “select” is deleted.'},
{k:'polysyndeton', t:'polysyndeton', d:'Putting “and” between every item in a list, where normal writing would use commas. It slows the sentence down and makes you take the items one at a time. (Greek: “many bindings.”)', ex:'“Joe Gould was an odd and penniless and unemployable little man who came to the city in 1916 and ducked and dodged and held on as hard as he could for over thirty-five years.” — Mitchell.'},
{k:'tricolon', t:'tricolon', d:'A three-beat pattern — three phrases or statements built the same way. (Greek: “three limbs.”)', ex:'“I came, I saw, I conquered.” — Julius Caesar. Three statements built the same way.'},
{k:'periodic', t:'periodic sentence', d:'A sentence that saves its main statement for the very end — everything stacks up first, then the payoff lands. (Greek periodos, “a way around”: the sentence closes its circuit only at the last word.)', ex:'“Like the credulous widow who wakes up one day to find the charming young man and all her savings gone, so the consenting subject of a piece of nonfiction writing learns—when the article or book appears—his hard lesson.” — Malcolm. The main point — “his hard lesson” — is held back to the last three words.'},
{k:'parallel', t:'parallel structure', d:'Phrases or statements built on the same frame, so the reader feels the pattern. The skeleton under anaphora, tricolons, and chiasmus.', ex:'“The white house seems deserted, too; but occasionally, when the animals become too clamorous, a light will flash on, a window will open, and a Coke bottle will come flying through the darkness and smash against the cans.” — Talese. Three clauses built on one frame.'},
{k:'chiasmus', t:'chiasmus', d:'The second half repeats the first half’s words in reverse order — A-B, then B-A. (Greek chi, the letter X: the halves cross.)', ex:'“Ask not what your country can do for you — ask what you can do for your country.” — Kennedy. The second half repeats the first in reverse.'},
{k:'simile', t:'simile', d:'A comparison that uses “like” or “as.”', ex:'“My soul has grown deep like the rivers.” — Hughes. The comparison uses “like.”'},
{k:'metaphor', t:'metaphor', d:'A comparison made directly, without “like” or “as” — one thing is said to be the other.', ex:'“Sinatra with a cold is Picasso without paint, Ferrari without fuel — only worse.” — Talese. No “like”: the comparison is made directly.'},
{k:'understatement', t:'understatement', d:'Saying less than the situation calls for, and letting the gap do the work.', ex:'“So it goes.” — Vonnegut, following every death in Slaughterhouse-Five: three words standing where the response to a death would go.'},
{k:'rhetq', t:'rhetorical question', d:'A question not fishing for an answer — it makes its point by asking.', ex:'“Isn’t it pretty to think so?” — Hemingway, closing The Sun Also Rises. No answer is wanted.'}
];
const GLOSSMAP = {}; GLOSS.forEach(g => GLOSSMAP[g.k] = g);
const TERMRE = new RegExp('\\b(' + [
 'comma splices?','compound predicates?','conjunctive adverbs?','periodic sentences?','pivot words?','prepositional phrases?','prepositions?','conjunctions?','joining words?','infinitives?','imperatives?','hyphens?','scare quotes','parallel structure','chiasmus','similes?','metaphors?','understatement','rhetorical questions?','direct address','passive voice','active voice','predicates?',
 'polysyndeton','asyndeton','epistrophe','anaphora','tricolons?','interjections?',
 'semicolons?','appositives?','participles?','gerunds?','pronouns?','antecedents?','fragments?','splices?','run-ons?','restrictive','nonrestrictive','colons?','dash(?:es)?'
].join('|') + ')\\b', 'gi');
function termKey(m){
  const s = m.toLowerCase();
  if (s.startsWith('comma splice') || s.startsWith('splice')) return 'splice';
  if (s.startsWith('compound')) return 'compoundpred';
  if (s.startsWith('conjunctive') || s.startsWith('pivot')) return 'pivotword';
  if (s.startsWith('periodic')) return 'periodic';
  if (s.startsWith('run-on')) return 'runon';
  if (s.startsWith('semicolon')) return 'semicolon';
  if (s.startsWith('appositive')) return 'appositive';
  if (s.startsWith('participle')) return 'participle';
  if (s.startsWith('gerund')) return 'gerund';
  if (s.startsWith('pronoun')) return 'pronoun';
  if (s.startsWith('prepositional') || s.startsWith('preposition')) return 'preposition';
  if (s.startsWith('conjunction') || s.startsWith('joining word')) return 'conjunction';
  if (s.startsWith('infinitive')) return 'infinitive';
  if (s.startsWith('imperative')) return 'imperative';
  if (s.startsWith('hyphen')) return 'hyphen';
  if (s.startsWith('scare quote')) return 'scarequotes';
  if (s.startsWith('parallel')) return 'parallel';
  if (s.startsWith('chiasmus')) return 'chiasmus';
  if (s.startsWith('simile')) return 'simile';
  if (s.startsWith('metaphor')) return 'metaphor';
  if (s.startsWith('understatement')) return 'understatement';
  if (s.startsWith('rhetorical')) return 'rhetq';
  if (s.startsWith('direct address')) return 'directaddress';
  if (s.startsWith('passive') || s.startsWith('active')) return 'voice';
  if (s.startsWith('predicate')) return 'predicate';
  if (s.startsWith('antecedent')) return 'antecedent';
  if (s.startsWith('fragment')) return 'fragment';
  if (s.startsWith('restrictive') || s.startsWith('nonrestrictive')) return 'restrictive';
  if (s.startsWith('colon')) return 'colon';
  if (s.startsWith('dash')) return 'dash';
  return {'polysyndeton':'polysyndeton','asyndeton':'asyndeton','epistrophe':'epistrophe','anaphora':'anaphora','interjection':'interjection'}[s.replace(/s$/,'')] || (s.startsWith('tricolon') ? 'tricolon' : null);
}
function glossify(el){
  if (!el) return;
  el.innerHTML = el.innerHTML.replace(TERMRE, m => {
    const k = termKey(m);
    return k && GLOSSMAP[k] ? '<span class="hov gterm" tabindex="0" data-g="' + k + '">' + m + '</span>' : m;
  });
  hookTips(el);
}
function hookTips(root){
  root.querySelectorAll('.hov').forEach(el => {
    if (el.dataset.hooked) return; el.dataset.hooked = '1';
    const fill = () => {
      if (el.dataset.g){ const g = GLOSSMAP[el.dataset.g]; el.dataset.t = g.t; el.dataset.x = g.d + (g.ex ? '<i class="tip-ex">' + g.ex + '</i>' : ''); }
    };
    el.addEventListener('mouseenter', () => { if (!tipPinned){ fill(); showTip(el); } });
    el.addEventListener('mouseleave', () => { if (!tipPinned) hideTip(); });
    el.addEventListener('focus', () => { fill(); showTip(el); });
    el.addEventListener('blur', hideTip);
    el.addEventListener('click', (e) => {
      e.stopPropagation(); fill();
      if (tipPinned === el){ hideTip(); return; }
      document.querySelectorAll('.hov.on').forEach(x=>x.classList.remove('on'));
      el.classList.add('on'); tipPinned = el; showTip(el);
    });
  });
}
const tip = () => document.getElementById('tip');
let tipPinned = null;
function showTip(el){
  const t = tip();
  t.innerHTML = '<span class="tip-label">' + el.dataset.t + '</span>' + el.dataset.x;
  t.style.display = 'block';
  const r = el.getBoundingClientRect(), tr = t.getBoundingClientRect();
  let x = r.left, y = r.bottom + 8;
  if (x + tr.width > window.innerWidth - 12) x = window.innerWidth - tr.width - 12;
  if (y + tr.height > window.innerHeight - 12) y = r.top - tr.height - 8;
  t.style.left = Math.max(8,x) + 'px'; t.style.top = Math.max(8,y) + 'px';
}
function hideTip(){ tip().style.display = 'none'; document.querySelectorAll('.hov.on').forEach(e=>e.classList.remove('on')); tipPinned = null; }

function moveToMd(m){
  let md = '## ' + m.name + '\n\n' + stripTags(m.d) + '\n\n';
  m.ex.forEach(e => { md += '> ' + stripTags(e.s) + '\n> — ' + stripTags(e.at) + '\n\n' + (e.n ? stripTags(e.n) + '\n\n' : ''); });
  return md;
}
function renderMoves(){
  const stage = $('stage'); stage.innerHTML = '';
  MOVES.forEach((m, i) => {
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML =
      '<p class="mv-name" data-ek="moves:' + i + ':name">' + m.name + '</p>' +
      '<p class="mv-def" data-ek="moves:' + i + ':d">' + m.d + '</p>' +
      m.ex.map((e, j) =>
        '<p class="mvq" data-ek="moves:' + i + ':ex:' + j + ':s">' + e.s + '</p>' +
        (e.n ? '<p class="mv-note" data-ek="moves:' + i + ':ex:' + j + ':n">' + e.n + '</p>' : '') +
        '<p class="mv-cite" data-ek="moves:' + i + ':ex:' + j + ':at">— ' + e.at + '</p>').join('');
    if (!editing){
      glossify(card.querySelector('.mv-def'));
      card.querySelectorAll('.mv-note').forEach(glossify);
    }
    stage.appendChild(card);
  });
  armEdits();
}
function lineToMd(l){
  return '> ' + stripTags(l.s.replace(/<br>/g, ' / ')) + '\n> — ' + stripTags(l.at) + '\n\n' + stripTags(l.n) + '\n\n';
}
function renderLines(){
  const stage = $('stage'); stage.innerHTML = '';
  const units = [];
  for (let i = 0; i < LINES.length; i++){
    if (LINES[i].pair && LINES[i+1]){ units.push([LINES[i], LINES[i+1]]); i++; }
    else units.push([LINES[i]]);
  }
  if (!editing) shuffle(units);
  units.flat().forEach(l => {
    const li = LINES.indexOf(l);
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML =
      '<p class="mvq" data-ek="lines:' + li + ':s">' + l.s + '</p>' +
      '<p class="mv-note" data-ek="lines:' + li + ':n">' + l.n + '</p>' +
      '<p class="mv-cite" data-ek="lines:' + li + ':at">— ' + l.at + '</p>';
    if (!editing) card.querySelectorAll('.mv-note').forEach(glossify);
    stage.appendChild(card);
  });
  armEdits();
}
const INTRO = [
 'A sentence has two parts: a <strong>subject</strong> — who or what it&rsquo;s about — and a <strong>predicate</strong>: the verb, the word that says what happened and when, plus everything attached to it. &ldquo;Gary Robinson died hungry&rdquo;: subject &ldquo;Gary Robinson,&rdquo; predicate &ldquo;died hungry.&rdquo; Subject plus verb makes a <strong>clause</strong> — a complete statement — and a sentence holds one clause or several.',
 'Every word belongs to a part of speech — noun, verb, adjective, adverb, pronoun, preposition, conjunction, article, interjection — and words build into <strong>phrases</strong> (no subject-verb pair of their own) and clauses (with one). Whatever isn&rsquo;t the subject or the verb is doing one of three jobs: <strong>modifying</strong> a noun or a verb, <strong>renaming</strong> one (&ldquo;Riga, the capital of Latvia&rdquo;), or <strong>joining</strong> clauses.'
];
const GLOSS_GROUPS = [
 ['Words', ['noun','verb','adjective','adverb','pronoun','antecedent','article','preposition','conjunction','infinitive','participle','gerund','interjection','pivotword']],
 ['Sentences', ['subject','predicate','object','sentence','statement','phrase','compoundpred','fragment','runon','splice','pinned','restrictive','appositive','imperative','tense','voice','directaddress','periodic']],
 ['Punctuation', ['semicolon','colon','dash','hyphen','ellipsismark','scarequotes']],
 ['Patterns', ['parallel','anaphora','epistrophe','asyndeton','polysyndeton','tricolon','chiasmus','simile','metaphor','understatement','rhetq']]
];
function renderGloss(){
  const stage = $('stage');
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = GLOSS_GROUPS.map((grp, gi) =>
    '<div class="eyebrow"' + (gi ? ' style="margin:22px 0 4px"' : '') + '>' + grp[0] + '</div>' +
    grp[1].map(k => GLOSSMAP[k]).filter(Boolean).map(g =>
      '<div class="g-row"><p class="g-term">' + g.t + '</p><p class="g-def">' + g.d + '</p>' +
      (g.ex ? '<p class="g-ex">' + g.ex + '</p>' : '') + '</div>').join('')
  ).join('');
  stage.innerHTML = ''; stage.appendChild(card);
}
let flashQueue = [], flashFlipped = false, flashTotal = 0, flashActive = false;
function startFlash(){
  flashQueue = shuffle(GLOSS.slice()); flashTotal = flashQueue.length;
  flashActive = true; flashFlipped = false; renderFlash();
}
function renderFlash(){
  const stage = $('stage');
  if (!flashQueue.length){
    flashActive = false;
    stage.innerHTML = '<div class="card done"><h2>All ' + flashTotal + ' terms,</h2><p>Run them again, or switch to Quiz.</p>' +
      '<button class="next" id="againbtn">Run them again</button></div>';
    $('againbtn').onclick = () => { startFlash(); };
    $('againbtn').focus({preventScroll:true});
    return;
  }
  const g = flashQueue[0];
  const card = document.createElement('div'); card.className = 'card'; card.id = 'flipcard';
  if (!flashFlipped){
    card.style.cursor = 'pointer';
    card.innerHTML = '<div class="eyebrow">Flashcards &middot; ' + flashQueue.length + ' left</div>' +
      '<p class="sentence" style="font-size:clamp(24px,4vw,30px)">' + g.t + '</p>' +
      '<div class="actions"><span class="hint">click or space to flip</span></div>';
    card.onclick = flipFlash;
  } else {
    card.innerHTML = '<div class="eyebrow">Flashcards &middot; ' + flashQueue.length + ' left</div>' +
      '<p class="sentence" style="font-size:22px">' + g.t + '</p>' +
      '<p class="g-def" style="font-size:15px; margin-top:8px">' + g.d + '</p>' +
      (g.ex ? '<p class="g-ex">' + g.ex + '</p>' : '') +
      '<div class="opts" style="margin-top:18px">' +
      '<button class="opt" id="flagain"><span class="key">1</span><span>Again &mdash; show it to me later</span></button>' +
      '<button class="opt" id="flgot"><span class="key">2</span><span>Got it</span></button></div>';
  }
  stage.innerHTML = ''; stage.appendChild(card);
  if (flashFlipped){
    $('flagain').onclick = () => { const g2 = flashQueue.shift(); flashQueue.splice(Math.min(3, flashQueue.length), 0, g2); flashFlipped = false; renderFlash(); };
    $('flgot').onclick = () => { flashQueue.shift(); flashFlipped = false; renderFlash(); };
  }
}
function flipFlash(){ flashFlipped = true; renderFlash(); }
function renderBasics(){
  const stage = $('stage');
  const card = document.createElement('div'); card.className = 'card';
  let h = '<div class="eyebrow">Basics</div>' +
    '<p class="why" style="font-size:15px" data-ek="intro:0">' + INTRO[0] + '</p>' +
    '<p class="why" style="font-size:15px; margin-top:8px" data-ek="intro:1">' + INTRO[1] + '</p>';
  h += GLOSS_GROUPS.map(grp =>
    '<div class="eyebrow" style="margin:26px 0 4px">' + grp[0] + '</div>' +
    grp[1].map(k => GLOSSMAP[k]).filter(Boolean).map(g =>
      '<div class="g-row"><p class="g-term" data-ek="gloss:' + g.k + ':t">' + g.t + '</p>' +
      '<p class="g-def" data-ek="gloss:' + g.k + ':d">' + g.d + '</p>' +
      (g.ex ? '<p class="g-ex" data-ek="gloss:' + g.k + ':ex">' + g.ex + '</p>' : '') + '</div>').join('')
  ).join('');



  card.innerHTML = h;
  stage.innerHTML = ''; stage.appendChild(card);
  if (!editing) card.querySelectorAll('.g-def').forEach(glossify);
  armEdits();
  document.addEventListener('click', hideTip);
}
document.addEventListener('keydown', e => {
  if (editing) return;
  if (flashActive && !flashFlipped && (e.key === ' ' || e.key === 'Enter')){
    if ($('flipcard')){ e.preventDefault(); flipFlash(); return; }
  }
  if (e.key === 'Enter'){
    const n = $('nextbtn'), a = $('againbtn');
    if (n && !n.disabled){ e.preventDefault(); advance(); }
    else if (a){ e.preventDefault(); newDeck(); }
    return;
  }
  const k = parseInt(e.key,10);
  if (k >= 1 && k <= 4 && !locked){
    const btns = document.querySelectorAll('.opt');
    if (btns[k-1] && !btns[k-1].disabled){ e.preventDefault(); btns[k-1].click(); }
  }
});
if (!loadRun('all')){
  if (loadRun('miss') && missTotal()) mode = 'miss';
}
newDeck();
</script>
