<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Close Reading</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%8D%3C/text%3E%3C/svg%3E">
</head>
<body>
<title>Close Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#57068C; --card:#FFFFFF; --ink:#1D1C1A; --muted:#1D1C1A; --faint:#1D1C1A;
    --onground:#FFFFFF; --onground-muted:#DCC6EF; --chip-on-bg:#FFFFFF; --chip-on-ink:#57068C;
    --tip-bg:#1D1C1A; --tip-ink:#FAFAF8;
    --line:#E5E2DA; --line-strong:#CFCBC1;
    --accent:#57068C; --accent-ink:#FFFFFF; --accent-soft:#F4ECFA;
    --good:#2F7D46; --good-soft:#EDF6EF; --bad:#B3352E; --bad-soft:#FAF0EF;
    --shadow:0 1px 2px rgba(29,28,26,.05), 0 10px 30px -12px rgba(20,0,40,.45);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1C0630; --card:#2A1440; --ink:#EDE7F3; --muted:#B4A3C8; --faint:#8A7699;
      --line:#3C2756; --line-strong:#4E3568;
      --onground:#F3EAFB; --onground-muted:#BFA3DC; --chip-on-bg:#EDE0F8; --chip-on-ink:#3A1160;
      --tip-bg:#120321; --tip-ink:#EDE7F3;
      --accent:#C08FE8; --accent-ink:#1B0C28; --accent-soft:#2E2139;
      --good:#6FBE87; --good-soft:#1F2E24; --bad:#E2756D; --bad-soft:#332222;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1C0630; --card:#2A1440; --ink:#EDE7F3; --muted:#B4A3C8; --faint:#8A7699;
    --line:#3C2756; --line-strong:#4E3568;
    --onground:#F3EAFB; --onground-muted:#BFA3DC; --chip-on-bg:#EDE0F8; --chip-on-ink:#3A1160;
    --tip-bg:#120321; --tip-ink:#EDE7F3;
    --accent:#C08FE8; --accent-ink:#1B0C28; --accent-soft:#2E2139;
    --good:#6FBE87; --good-soft:#1F2E24; --bad:#E2756D; --bad-soft:#332222;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{background:var(--paper); color:var(--ink); margin:0;
    font-family:'Archivo', system-ui, sans-serif; -webkit-font-smoothing:antialiased; line-height:1.5}
  .wrap{max-width:700px; margin:0 auto; padding:40px 20px 90px}
  .masthead{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:6px}
  h1{font-family:'Newsreader', Georgia, serif; font-weight:600; font-size:clamp(28px,5vw,36px); margin:0; letter-spacing:-.01em; color:var(--onground)}
  h1 .comma{color:var(--accent)}
  .stats{font-family:'IBM Plex Mono', ui-monospace, monospace; font-size:13px; color:var(--onground-muted);
    display:flex; gap:16px; font-variant-numeric:tabular-nums}
  .stats b{color:var(--onground); font-weight:500}
  .modes{display:flex; gap:8px; margin:14px 0 0; flex-wrap:wrap}
  .chip{font:500 13px 'Archivo',sans-serif; padding:6px 13px; border-radius:999px;
    border:1px solid var(--onground-muted); background:transparent; color:var(--onground-muted); cursor:pointer}
  .chip:hover{border-color:var(--onground); color:var(--onground)}
  .chip[aria-pressed="true"]{background:var(--chip-on-bg); border-color:var(--chip-on-bg); color:var(--chip-on-ink)}
  .chip:disabled{opacity:.4; cursor:default}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); padding:28px 30px 24px; margin-top:20px}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--faint); margin-bottom:16px}
  .sentence{font-family:'Newsreader', Georgia, serif; font-size:clamp(21px,3.4vw,26px); line-height:1.42;
    font-weight:400; margin:0 0 6px; max-width:34em}
  .prompt{color:var(--muted); font-size:15px; margin:14px 0 18px}
  .opts{display:flex; flex-direction:column; gap:9px}
  .opt{display:flex; align-items:baseline; gap:12px; text-align:left; width:100%;
    font:400 15.5px/1.45 'Archivo',sans-serif; color:var(--ink);
    background:transparent; border:1px solid var(--line-strong); border-radius:10px;
    padding:11px 14px; cursor:pointer}
  .opt:hover{border-color:var(--accent); background:var(--accent-soft)}
  .opt .key{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--faint);
    border:1px solid var(--line); border-radius:5px; padding:1px 6px; flex:none}
  .opt[data-state="right"]{border-color:var(--good); background:var(--good-soft)}
  .opt[data-state="wrong"]{border-color:var(--bad); background:var(--bad-soft)}
  .opt[data-state="dim"]{opacity:.6}
  .opt:disabled{cursor:default}
  .verdict{margin-top:20px; border-left:3px solid var(--good); padding:4px 0 4px 16px; animation:rise .25s ease-out}
  .verdict.bad{border-left-color:var(--bad)}
  .verdict .call{font:600 13px 'Archivo',sans-serif; letter-spacing:.06em; text-transform:uppercase; color:var(--good); margin:0 0 4px}
  .verdict.bad .call{color:var(--bad)}
  .verdict .why{margin:0; font-size:15px; color:var(--ink)}
  .verdict .att{margin:8px 0 0; font-size:13.5px; color:var(--muted); font-style:italic}
  .savebtn{margin-top:12px; font:500 12.5px 'Archivo',sans-serif; background:none;
    border:none; padding:0; color:var(--muted); cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px}
  .savebtn:hover{color:var(--accent)}
  .savebtn[data-on="true"]{color:var(--accent)}
  @keyframes rise{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){ .verdict{animation:none} }
  .actions{display:flex; justify-content:space-between; align-items:center; margin-top:22px}
  .hint{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--faint)}
  .next{font:600 14px 'Archivo',sans-serif; background:var(--accent); color:var(--accent-ink);
    border:none; border-radius:9px; padding:10px 22px; cursor:pointer}
  .next:disabled{opacity:0; pointer-events:none}
  .done{text-align:center; padding:44px 20px}
  .done h2{font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:30px; margin:0 0 10px}
  .done p{color:var(--muted); margin:0 0 22px}
  .copyall,.mini{font:500 12.5px 'Archivo',sans-serif; background:transparent; border:1px solid var(--line-strong);
    border-radius:7px; padding:5px 11px; color:var(--muted); cursor:pointer}
  .copyall:hover,.mini:hover{border-color:var(--accent); color:var(--ink)}
  .sv-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px}
  .sv-item{border-top:1px solid var(--line); padding:18px 0 16px}
  .sv-item .sentence{font-size:19px; margin-bottom:4px}
  .sv-meta{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--faint); margin:0 0 8px}
  .sv-why{font-size:14.5px; margin:0 0 12px}
  .sv-actions{display:flex; gap:8px}
  .ex{margin:22px 0 2px}
  .ex .sentence{font-size:20px; line-height:1.6}
  .hov{border-bottom:1.5px dotted var(--accent); cursor:help; border-radius:2px; padding:0 1px}
  .hov:hover,.hov.on{background:var(--accent-soft)}
  #tip{position:fixed; z-index:50; max-width:330px; background:var(--tip-bg); color:var(--tip-ink);
    padding:10px 13px; border-radius:8px; font:400 13.5px/1.5 'Archivo',sans-serif; display:none;
    box-shadow:0 6px 24px -8px rgba(0,0,0,.35)}
  #tip b{display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:500;
    text-transform:uppercase; letter-spacing:.09em; margin-bottom:4px; opacity:.7}
  .ex-cite{font-size:12.5px; color:var(--faint); font-style:italic; margin:4px 0 0}
  .fixlabel{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.09em;
    text-transform:uppercase; color:var(--faint); margin:14px 0 4px}
  .fixlabel:first-of-type{margin-top:0}
  .sentence.rwtext{color:var(--muted); font-size:clamp(19px,3vw,22px)}
  .sentence b{font-weight:600}
  .mvq{font-family:'Newsreader',Georgia,serif; font-size:clamp(17px,2.6vw,19.5px); line-height:1.62; margin:12px 0 3px}
  .mvq b{font-weight:600}
  .mv-note{font-size:13.5px; line-height:1.55; margin:3px 0 2px; color:var(--muted); max-width:64ch}
  .mv-cite{font-size:12.5px; color:var(--faint); font-style:italic; margin:0 0 4px}
  .mv-name{font:600 19px 'Archivo',sans-serif; margin:0 0 4px}
  .mv-def{font-size:14.5px; line-height:1.55; margin:0 0 4px; color:var(--muted); max-width:62ch}
  .g-row{border-top:1px solid var(--line); padding:13px 0 12px}
  .g-row:first-of-type{border-top:none; padding-top:0}
  .g-term{font:600 15px 'Archivo',sans-serif; margin:0 0 3px; color:var(--accent)}
  .g-def{font-size:14.5px; line-height:1.55; margin:0; color:var(--ink); max-width:62ch}
  .g-ex{font-family:'Newsreader',Georgia,serif; font-size:15.5px; color:var(--muted); margin:4px 0 0; font-style:italic}


  button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
</style>

<div class="wrap">
  <div class="masthead">
    <h1>Close Reading</h1>
    <div class="stats">
      <span id="scoreline">no answers yet</span>
    </div>
  </div>
  <div class="modes" id="modes"></div>
  <main id="stage"></main>
  <div id="tip" role="tooltip"></div>
</div>

<script>
const DATA = [
{id:'bd1', cat:'semicolons', s:'“But <b>he said nothing; he had been silent</b> during much of the evening, except now in this private club in Beverly Hills he seemed even more distant, staring out through the smoke and semidarkness into a large room beyond the bar where dozens of young couples sat huddled around small tables or twisted in the center of the floor to the clamorous clang of folk-rock music blaring from the stereo.”',
 q:'What is the semicolon doing?', o:['Joining two complete statements','Introducing a list','Standing in for a comma','Marking a pause before “he”'], a:0,
 w:'Both halves could stand alone as sentences. The semicolon is a mark that can hold two sentences together as one — so his silence stretches across the whole evening without a full stop. (Starting a sentence with “But” is fine; professionals do it constantly.)',
 at:'Gay Talese, &ldquo;Frank Sinatra Has a Cold,&rdquo; Esquire, 1966'},
{id:'bd2', cat:'short sentences', s:'&ldquo;Gary Robinson died hungry.&rdquo;',
 q:'Complete sentence or fragment?', o:['Complete: subject, verb, final state','Fragment — too short to be a sentence','Fragment — the verb has no object','Neither — a headline, not a sentence'], a:0,
 w:'It has a subject (Gary Robinson) and a verb (died), so it’s a complete sentence — length doesn’t matter. Everything else, the chicken and the shooting, is left for you to fill in. That’s why four words hit so hard.',
 at:'Edna Buchanan&rsquo;s lede, in Calvin Trillin, &ldquo;Covering the Cops,&rdquo; The New Yorker, 1986'},
{id:'bd3', cat:'clause joins', s:'“It is raining<b>, and</b> Mikhail Baryshnikov is standing in a courtyard in Riga, the capital of Latvia, pointing up at two corner windows of an old stucco building that was probably yellow once.”',
 q:'What keeps this one sentence instead of three?', o:['Comma + “and”; the rest is description','Two splices, one after each comma','A hidden semicolon after “raining”','Nothing joins them — it’s a run-on'], a:0,
 w:'Two statements — “It is raining” and “Baryshnikov is standing…” — and comma + “and” is the normal, correct way to hold two statements in one sentence. The rest is description: “the capital of Latvia” renames Riga (an appositive), “pointing up…” shows what he’s doing. No new statements start, so it stays one long camera move.',
 at:'Joan Acocella, &ldquo;The Soloist,&rdquo; The New Yorker, 1998'},
{id:'bd4', cat:'verb chains', s:'“He <b>swallows</b> gruel for breakfast, <b>is fond of</b> oatmeal, <b>digests</b> milk and onion soup, <b>declines</b> meat, which even as an undernourished youth he avoided, <b>never touches</b> fish, <b>has given up</b> macaroni as fattening, <b>eats</b> one piece of bread at a meal, <b>favors</b> vegetables, greens, and salads, <b>drinks</b> lemonade, <b>likes</b> tea and cake, and <b>loves</b> a raw apple.”',
 q:'A dozen commas. Why is this not a splice chain?', o:['One subject running a list of verbs','A splice chain — comma after comma','Each verb starts a new sentence','The final “and” makes it all right'], a:0,
 w:'Every verb — swallows, digests, declines, loves — belongs to the one “He” at the start. No verb gets its own new subject, so no new sentence ever starts. The commas just separate items in a list of things he does. It reads like an inventory of his diet, which is the point.',
 at:'Janet Flanner, &ldquo;F&uuml;hrer,&rdquo; The New Yorker, 1936'},
{id:'bd5', cat:'appositives', s:'“It’s late already<b>, five or five-thirty</b>.”',
 q:'What is “five or five-thirty”?', o:['A second name for “late,” set beside it','A spliced second sentence','A fragment','A description aimed at the wrong word'], a:0,
 w:'“Five or five-thirty” has no verb, so it can’t be a sentence on its own. It just sits next to “late” to say it more exactly (an appositive). The “or” gives you the mood: he isn’t sure, and doesn’t much care.',
 at:'Larissa MacFarquhar, &ldquo;Present Waking Life,&rdquo; The New Yorker, 2005'},
{id:'bd6', cat:'fragments', s:'&ldquo;Penis with a thesaurus.&rdquo;',
 q:'Classify it.', o:['A fragment — no verb','A complete sentence','A run-on','Two statements fused'], a:0,
 w:'No verb — nothing happens — so it’s a fragment: a piece of a sentence wearing a period. Here that’s on purpose: with no verb, there’s nothing left to argue with.',
 at:'David Foster Wallace, quoted in Patricia Lockwood, &ldquo;Malfunctioning Sex Robot,&rdquo; LRB, 2019'},
{id:'bd7', cat:'participles', s:'“He is a kind of confidence man, <b>preying</b> on people’s vanity, ignorance, or loneliness, <b>gaining</b> their trust and <b>betraying</b> them without remorse.”',
 q:'Do “preying” and “gaining” start new sentences?', o:['No — trailing participles, not new sentences','Yes — comma splices, one per verb','Only because of the final “and”','Yes — three separate sentences'], a:0,
 w:'No. “Preying” and “gaining” are participles — -ing verb-forms used as description — with no subject of their own. They don’t start new sentences; they keep describing the confidence man. One sentence, with the charges piling up after the main point is made.',
 at:'Janet Malcolm, The Journalist and the Murderer, 1990'},
{id:'bd8', cat:'clause joins', s:'“Willing but not forward, Cary Grant must be the most publicly seduced male the world has known<b>, yet</b> he has never become a public joke—not even when Tony Curtis parodied him in ‘Some Like It Hot,’ encouraging Marilyn Monroe to rape.”',
 q:'What joins the two statements?', o:['Comma + “yet”','The comma alone — splice','The fronted adjectives','An implied semicolon'], a:0,
 w:'The comma plus “yet.” “Yet” is one of the seven small joining words (and, but, or, nor, for, so, yet) allowed to hold two statements together with a comma. And notice “Willing but not forward” comes before Grant’s name — you get the judgment before you get the man.',
 at:'Pauline Kael, &ldquo;The Man from Dream City,&rdquo; The New Yorker, 1975'},
{id:'bd9', cat:'semicolons', s:'“Merle stares a lot; onstage<b>, where he almost never talks between songs,</b> he can seem oblivious of the audience.”',
 q:'What do the paired commas fence off?', o:['An aside you could lift out whole','A splice','A second name for Merle','A fragment'], a:0,
 w:'The part between the commas — “where he almost never talks between songs” — is an aside. You could lift it out and the sentence would still work; that’s why it gets a comma on each side, like brackets. The semicolon joins the two main statements.',
 at:'Bryan Di Salvatore, &ldquo;Ornery,&rdquo; The New Yorker, 1990'},
{id:'bd10', cat:'short sentences', s:'&ldquo;The man came to the village on a moped. Youssouf Mal&eacute; watched him. A man on a moped was unusual.&rdquo;',
 q:'Fragments?', o:['No — three complete sentences','The third is a fragment','All three are','The first two should be joined'], a:0,
 w:'No — each one has a subject and a verb, so each is a complete sentence. The smallness is a choice: information arrives one plain fact at a time, the way news travels in a small village.',
 at:'Michael Finkel, &ldquo;Is Youssouf Mal&eacute; a Slave?,&rdquo; The New York Times Magazine, 2001'},
{id:'mv1', cat:'word order', s:'“<b>Dictator of a nation devoted to splendid sausages, cigars, beer, and babies,</b> Adolf Hitler is a vegetarian, teetotaller, nonsmoker, and celibate.”',
 q:'What is “Dictator of a nation…babies”?', o:['A description of Hitler, moved ahead of his name','A separate sentence, spliced on','A description attached to the wrong person','A clause that could stand alone'], a:0,
 w:'The whole opening phrase is a description of Hitler, placed before his name. You hear about a nation that loves sausages, cigars, beer, and babies — and then meet the man who refuses all four. The order of the sentence is what makes the joke land.',
 at:'Janet Flanner, &ldquo;F&uuml;hrer,&rdquo; The New Yorker, 1936'},
{id:'mv2', cat:'participles', s:'“<b>Persuaded to wait his turn,</b> he reached the counter again five or ten minutes later, only to be told that Church’s had run out of fried chicken.”',
 q:'What is “Persuaded to wait his turn”?', o:['A description of “he,” correctly attached','A description attached to the wrong person (a dangler)','A phrase with no owner at all','A fragment'], a:0,
 w:'It describes “he” — he’s the one who was persuaded — so it’s attached to the right person. The polite wording, applied to a drunk man in a fried-chicken line, is what makes it funny; the grammar keeps a straight face.',
 at:'Calvin Trillin, &ldquo;Covering the Cops,&rdquo; The New Yorker, 1986'},
{id:'mv3', cat:'the dropped &ldquo;and&rdquo;', s:'“We interpret what we see<b>, select</b> the most workable of the multiple choices.”',
 q:'What happened between “interpret” and “select”?', o:['The “and” between the verbs was cut','It’s a comma splice','“Select” starts a new sentence','Nothing — commas do this normally'], a:0,
 w:'The “and” was deleted: “interpret what we see and select…” became “interpret…, select…” (asyndeton). It is not a comma splice, because a splice joins two complete statements, each with its own subject — here “select” has no subject of its own; it still belongs to “we.” One subject, two verbs, missing “and.”',
 at:'Joan Didion, &ldquo;The White Album,&rdquo; 1979'},
{id:'mv4', cat:'lists', s:'“Joe Gould was an odd <b>and</b> penniless <b>and</b> unemployable little man who came to the city in 1916 and <b>ducked and dodged and held on</b> as hard as he could for over thirty-five years.”',
 q:'What are the repeated “ands” doing?', o:['Slowing the sentence down on purpose','Loose editing that survived revision','Just marking a list','Satisfying a comma rule'], a:0,
 w:'Normally you’d write “odd, penniless, and unemployable.” Mitchell writes “odd AND penniless AND unemployable” — extra “ands” everywhere (polysyndeton). They slow the sentence to a trudge, so you feel the thirty-five years of hanging on.',
 at:'Joseph Mitchell, &ldquo;Professor Sea Gull,&rdquo; The New Yorker, 1942'},
{id:'mv5', cat:'repetition', s:'“<b>It is more than</b> Hank Williams, Sr., Johnny Cash, and Glen Campbell <b>combined</b>. <b>It is more than</b> George Jones, Hank Snow, and Ray Price <b>combined</b>.”',
 q:'Name the device.', o:['Repeated openings and endings','Comma splices in both sentences','Too many “ands” in a row','A list punctuated wrong'], a:0,
 w:'Both sentences open with the same words (“It is more than”) and end on the same word (“combined”). Repeating the frame turns a statistic into a drumbeat — each sentence hits the same spot harder.',
 at:'Bryan Di Salvatore, &ldquo;Ornery,&rdquo; The New Yorker, 1990'},
{id:'mv6', cat:'repetition', s:'“<b>He</b> had some coffee. <b>He</b> read the newspaper. <b>He</b> dipped into a couple of books: a Proust biography that he bought five years ago but just started reading because it suddenly occurred to him to do so, a novel by Jean Rhys that he recently came across in a secondhand bookstore—he’s not a systematic reader.”',
 q:'What is the “He… He… He…” doing?', o:['Starting three sentences the same way','Fragmenting the paragraph','Padding out the scene','Building suspense toward the books'], a:0,
 w:'Three short sentences, each with the same subject (“He”) and a plain past-tense verb — no joining, no subordination. Repeating the opener across sentences is called anaphora. Here it presents the morning as a list of equal, small actions.',
 at:'Larissa MacFarquhar, &ldquo;Present Waking Life,&rdquo; The New Yorker, 2005'},
{id:'mv7', cat:'repetition', s:'“The white house seems deserted, too; but occasionally, when the animals become too clamorous, <b>a light will flash on, a window will open, and a Coke bottle will come flying</b> through the darkness and smash against the cans.”',
 q:'What is the structure of the three clauses?', o:['Three matching statements in a list','Comma splices between statements','Three names for one event','One “and” too many'], a:0,
 w:'Three mini-statements built exactly the same way: a light will, a window will, a bottle will. Because they match, you read them as beats — one, two, three — like frames of film. The final “and” makes it all standard grammar.',
 at:'Gay Talese, &ldquo;The Loser,&rdquo; Esquire, 1964'},
{id:'mv8', cat:'tense', s:'“IF COLIN DUFFY AND I WERE TO GET MARRIED, we <b>would have</b> matching superhero notebooks. We <b>would wear</b> shorts, big sneakers, and long, baggy T-shirts depicting famous athletes every single day, even in the winter. We <b>would sleep</b> in our clothes.”',
 q:'Which “would” is this?', o:['The hypothetical — one “if” carries it all','The habitual (what he regularly did)','Politeness to the reader','Future-in-past'], a:0,
 w:'This “would” means “in the made-up world where we got married.” The one “if” at the top keeps that pretend world open for sentence after sentence. (There’s another “would” — “he would slouch,” meaning he always did — a different tool.)',
 at:'Susan Orlean, &ldquo;The American Man at Age Ten,&rdquo; Esquire, 1992'},
{id:'mv9', cat:'appositives', s:'“<b>A big, burly guy,</b> he had a macho strain in him—<b>a pugilistic vision of intellectual life</b>.”',
 q:'What are “A big, burly guy” and “a pugilistic vision of intellectual life”?', o:['Two renamings, before the clause and after the dash','Two splices in one sentence','Two separate sentences','Two descriptions aimed at the wrong nouns'], a:0,
 w:'Both phrases are second names pinned onto him (appositives): “a big, burly guy” before the sentence starts its work, “a pugilistic vision of intellectual life” after the dash. Sized up on the way in, summed up on the way out.',
 at:'Alex Ross, on Richard Taruskin, The New Yorker, 2022'},
{id:'mv10', cat:'pivot words', s:'“<b>Rather,</b> it was a supremely cool crush — she walked through the world with the confidence of a woman who was not aspiring to have a man, even a superman, but like a woman who finally found a man who was worthy of her.”',
 q:'What is “Rather” doing?', o:['A turn against the previous sentence','Joining two statements with a comma','Renaming the crush that follows','Nothing — decoration'], a:0,
 w:'“Rather” is a turn-word — it can’t glue two statements together, but at the start of a fresh sentence it doesn’t need to. It makes this whole sentence a correction of the one before it: not that kind of crush, this kind.',
 at:'Taffy Brodesser-Akner, on Margot Kidder, The New York Times, 2018'},
{id:'mv11', cat:'pivot words', s:'“<b>Certainly,</b> he had a point about Strauss’s remorseless performance of ‘Death and Transfiguration.’”',
 q:'Name the move.', o:['Fronted adverb + comma, then the judgment','A splice','A stray description','A modifier aimed at the wrong noun'], a:0,
 w:'One word out front, then a comma, then the point. The comma forces a tiny pause, so the judgment lands harder. Nik Cohn built a style on this: “Always, he came back to sex.”',
 at:'Alex Ross, on Richard Taruskin, The New Yorker, 2022'},
{id:'mv12', cat:'trailing description', s:'“He saunters out from shadows in the back of the stage<b>, indistinguishable at first from the four other band members</b>.”',
 q:'What is “indistinguishable at first…”?', o:['A trailing description of “he”','A spliced second sentence','A phrase with no owner','The start of a new sentence'], a:0,
 w:'The sentence is complete at “stage.” Then one more description hangs on after the comma — and in that extra beat you watch the most famous man in music fail to stand out from his own band. The tail of the sentence is where the joke happens.',
 at:'Alex Ross, &ldquo;The Wanderer,&rdquo; The New Yorker, 1999'},
{id:'mv13', cat:'word order', s:'“Like the credulous widow who wakes up one day to find the charming young man and all her savings gone, so the consenting subject of a piece of nonfiction writing learns—when the article or book appears—<b>his hard lesson</b>.”',
 q:'Why does “his hard lesson” come last?', o:['The payoff is held back to the end','The sentence just ran long','Poor planning by the writer','The dashes require it'], a:0,
 w:'Everything piles up first — the widow, the charming young man, the vanished savings — and the main point is held back to the last three words. You walk the whole path before being told where it leads. The delay is the trap, and the trap is Malcolm’s argument.',
 at:'Janet Malcolm, The Journalist and the Murderer, 1990'},
{id:'mv14', cat:'participles', s:'“Frank Sinatra, <b>holding a glass of bourbon in one hand and a cigarette in the other,</b> stood in a dark corner of the bar between two attractive but fading blondes who sat waiting for him to say something.”',
 q:'What sits between “Sinatra” and “stood”?', o:['A description wedged mid-sentence','A second name for Sinatra','A separate statement','A clause with its own verb'], a:0,
 w:'“Holding a glass of bourbon…” is a description built on a participle — an -ing verb-form doing the work of description. It’s wedged between “Frank Sinatra” and “stood,” so you wait through the description to find out what he’s doing — the same way the room waits for him.',
 at:'Gay Talese, &ldquo;Frank Sinatra Has a Cold,&rdquo; Esquire, 1966'},
{id:'mv15', cat:'word order', s:'“<b>Limited by physical temperament, trained in poverty, organically costive,</b> he has become the dietetic survivor of his poor health.”',
 q:'What are the three phrases before “he”?', o:['Three descriptions stacked before “he”','Three comma splices in a row','Three separate sentences','Three subordinate clauses'], a:0,
 w:'Three descriptions stack up before “he” even arrives: limited by this, trained in that. By the time the man shows up, he’s already been diagnosed. Stacking descriptions in front builds pressure like a drumroll.',
 at:'Janet Flanner, &ldquo;F&uuml;hrer,&rdquo; The New Yorker, 1936'},
{id:'mv16', cat:'short sentences', s:'&ldquo;I was hired as an assassin. You don&rsquo;t bring in a 37-year-old woman to review John Updike in the year of our Lord 2019 unless you&rsquo;re hoping to see blood on the ceiling.&rdquo;',
 q:'What is the device?', o:['Length contrast, short then long','A repetition pattern of claims','A comma splice','A withheld payoff'], a:0,
 w:'The first sentence is six words. The second is thirty. The short one makes the claim; the long one backs it up. Sentence size is a tool like any other.',
 at:'Patricia Lockwood, &ldquo;Malfunctioning Sex Robot,&rdquo; LRB, 2019'},
{id:'pc1', cat:'semicolons', s:'“AT THE FOOT of a mountain in upstate New York, about sixty miles from Manhattan, there is an abandoned country clubhouse with a dusty dance floor, upturned barstools, and an untuned piano<b>; and</b> the only sounds heard around the place at night come from the big white house behind it—the clanging sounds of garbage cans being toppled by raccoons, skunks, and stray cats making their nocturnal raids down from the mountain.”',
 q:'Why a semicolon before &ldquo;and&rdquo;?', o:['Commas inside both halves; the seam needs more','Redundancy — the “and” already joins','An error a copyeditor missed','House style, nothing more'], a:0,
 w:'Each half has its own little commas &mdash; &ldquo;dance floor, upturned barstools&rdquo; in the first, &ldquo;raccoons, skunks, and stray cats&rdquo; in the second. With that many small commas around, the main joint between the two statements gets a stronger mark, the semicolon &mdash; even though &ldquo;and&rdquo; is right there too.',
 at:'Gay Talese, &ldquo;The Loser,&rdquo; Esquire, 1964'},
{id:'pc2', cat:'colons', s:'“He dipped into a couple of books<b>:</b> a Proust biography that he bought five years ago but just started reading because it suddenly occurred to him to do so, a novel by Jean Rhys that he recently came across in a secondhand bookstore<b>—</b>he’s not a systematic reader.”',
 q:'What are the colon and the dash each doing?', o:['Colon delivers; dash changes direction','Both are punctuation errors','Both introduce lists of books','The dash corrects the colon’s list'], a:0,
 w:'“He dipped into a couple of books” could end with a period, so it’s allowed to take a colon and hand over the list. Then the dash breaks off the list for the real point: he’s not a systematic reader. Colon = delivery; dash = change of direction.',
 at:'Larissa MacFarquhar, &ldquo;Present Waking Life,&rdquo; The New Yorker, 2005'},
{id:'pc3', cat:'commas', s:'“Martha Nussbaum was preparing to give a lecture at Trinity College<b>, Dublin,</b> in April<b>, 1992,</b> when she learned that her mother was dying in a hospital in Philadelphia.”',
 q:'Why commas after “Dublin” and “1992”?', o:['They close place-and-date pairs','Comma splices','Optional pauses for breath','A three-item list'], a:0,
 w:'“Trinity College, Dublin” and “April, 1992” are two-part names, and each needs a closing comma, like a closed bracket. Tidy bookkeeping — right before the sentence delivers the news about her mother. The neatness makes the news land harder.',
 at:'Rachel Aviv, &ldquo;The Philosopher of Feelings,&rdquo; The New Yorker, 2016'},
{id:'pc4', cat:'dashes', s:'“Clooney, who is unusual in being both very famous and, apparently, at ease with the fact<b>—he can sometimes look like a spokesman for celebrity itself—</b>was sitting on a long pale sofa, alongside Sarah Larson, his girlfriend.”',
 q:'Why dashes instead of commas for the aside?', o:['The aside is a whole sentence of its own','Dashes are more elegant than commas','Commas would create a splice','No reason — writer’s habit'], a:0,
 w:'The words between the dashes are a whole sentence of their own. A full sentence dropped inside another one needs dashes to keep its walls visible — commas would let it dissolve into the crowd. And that aside is the profile’s whole idea, planted in line one.',
 at:'Ian Parker, &ldquo;Somebody Has to Be in Control,&rdquo; The New Yorker, 2008'},
{id:'pc5', cat:'colons', s:'“She’s a rare combination<b>:</b> a thin, long-limbed beauty with a trained analytic mind who dresses with cunning understatement.”',
 q:'What allows the colon?', o:['The complete statement on its left','The list on its right side','The capital letter after it','The “who” clause at the end'], a:0,
 w:'The rule: whatever sits to the left of a colon must work as a full sentence. “She’s a rare combination” does. So the colon may deliver what she’s a combination OF — and that delivery is the whole sales pitch of the piece.',
 at:'Joan Juliet Buck, &ldquo;A Rose in the Desert,&rdquo; Vogue, 2011'},
{id:'pc6', cat:'lists', s:'“In New York City, especially in Greenwich Village, down among the cranks and the misfits and the <b>one-lungers</b> and the <b>has-beens</b> and the <b>might’ve-beens</b> and the <b>would-bes</b> and the <b>never-wills</b> and the <b>God-knows-whats</b>, I have always felt at home.”',
 q:'What are the hyphens doing?', o:['Coining nouns — a has-been, a never-will','Marking pauses in the list','Joining eight short sentences','Optional decoration on the list'], a:0,
 w:'Each hyphen glues words into a single new noun: a has-been, a never-will, a God-knows-what. Without the hyphens the phrases fall apart. Gould is inventing nouns for people nobody bothered to name.',
 at:'Joe Gould, quoted in Joseph Mitchell, &ldquo;Professor Sea Gull,&rdquo; The New Yorker, 1942'},
{id:'pc7', cat:'dashes', s:'“Sinatra with a cold is Picasso without paint, Ferrari without fuel <b>— only worse</b>.”',
 q:'What is the dash doing?', o:['Cutting off the list for the last words','Joining two full statements','Setting off a liftable aside','Repairing an earlier comma'], a:0,
 w:'“Picasso without paint, Ferrari without fuel” is a two-item list. The dash stops the list and holds a beat of silence before the last word drops. The pause before a punchline. (The comma before “Ferrari” separates list items — it isn’t joining sentences.)',
 at:'Gay Talese, &ldquo;Frank Sinatra Has a Cold,&rdquo; Esquire, 1966'},
{id:'pc8', cat:'semicolons', s:'“He plays five numbers from his most recent album, ‘Time Out of Mind’<b>;</b> several hits, among them ‘Don’t Think Twice, It’s All Right’ and ‘Masters of War’<b>;</b> and something more unexpected from his five-hundred-song back catalogue—‘You Ain’t Goin’ Nowhere.’”',
 q:'Why semicolons in this list?', o:['The list items have commas inside them','Each item is a full sentence','Affectation — style points','An error of rank'], a:0,
 w:'The song titles have commas INSIDE them (“Don’t Think Twice, It’s All Right”), so commas between the items would turn the list to soup. Semicolons act as bigger commas and keep it readable.',
 at:'Alex Ross, &ldquo;The Wanderer,&rdquo; The New Yorker, 1999'},
{id:'pc9', cat:'dashes', s:'“Edna Buchanan covered the murder for the Herald<b>—there are policemen in Miami who say that it wouldn’t be a murder without her—</b>and her story began with what the fried-chicken faction still regards as the classic Edna lead: ‘Gary Robinson died hungry.’”',
 q:'Why is the aside in dashes?', o:['It’s a whole sentence inside another','Commas would make it a splice','Emphasis, nothing structural','It’s trivia the editor kept'], a:0,
 w:'The bit between the dashes — “there are policemen in Miami who say…” — is a full sentence inside another sentence. Only dashes (or parentheses) are strong enough to hold that. And what they hold is her legend, vouched for by cops, mid-sentence.',
 at:'Calvin Trillin, &ldquo;Covering the Cops,&rdquo; The New Yorker, 1986'},
{id:'pc10', cat:'semicolons', s:'“In the dim kitchen, his face hung limp and pale<b>;</b> his eyes were dull and heavily lidded, barely visible beneath thick, ridged brows…”',
 q:'What does the semicolon do that a period wouldn’t?', o:['Keeps both observations in one look','It pauses longer than a comma','It adds formality, nothing else','Nothing — a period would be the same'], a:0,
 w:'A period would chop the look into two separate glances. A comma alone isn’t allowed between two full statements. The semicolon keeps face and eyes inside one steady stare — connected, but under control.',
 at:'Bryan Di Salvatore, &ldquo;Ornery,&rdquo; The New Yorker, 1990'},
{id:'jd1', cat:'splices', s:'“We smile when we <b>see him, we laugh</b> before he does anything; it makes us happy just to look at him.”',
 q:'The first comma joins two full statements. Why does it hold up?', o:['Matching “we” clauses make it one reflex','It doesn’t — it stays an error','Matching shapes make it grammatical','The semicolon fixes it retroactively'], a:0,
 w:'“We smile…” and “we laugh…” are both complete statements, so that comma is breaking the rule — a comma splice. It works because the two match so closely they read as one reflex: you don’t smile and then laugh, it’s one motion. The semicolon then joins the last part the standard way. One rule broken, one followed, both on purpose.',
 at:'Pauline Kael, &ldquo;The Man from Dream City,&rdquo; The New Yorker, 1975'},
{id:'jd2', cat:'clause joins', s:'“The naked woman on the ledge outside the window on the sixteenth floor is a victim of accidie<b>, or</b> the naked woman is an exhibitionist<b>, and</b> it would be ‘interesting’ to know which.”',
 q:'Anything ungrammatical here?', o:['No — the unease is tonal, not grammatical','Yes — the two comma splices','Yes — a fragment at the end','Yes — the quotes around “interesting”'], a:0,
 w:'Nothing. Every join uses “or” or “and” the standard way. What unsettles is the tone: a possible suicide laid out like a quiz question, with “interesting” in quotes because Didion refuses to actually feel it.',
 at:'Joan Didion, &ldquo;The White Album,&rdquo; 1979'},
{id:'jd3', cat:'fragments', s:'“I wish Bob Dylan died. Then Channel 5 would piece together an instant documentary on his life and times. . . . <b>Just the immutable facts.</b>”',
 q:'“Just the immutable facts.” Error or choice?', o:['Choice: a verbless fragment as dismissal','An error — attach it to the sentence','An error — it needs a verb','A transcription mistake'], a:0,
 w:'A choice. It has no verb — a fragment — and that’s the effect: a shrug, case closed. Give it a verb (“I just want the facts”) and it turns earnest, which is exactly what the writer didn’t want.',
 at:'Mark Jacobson, Village Voice, quoted in Alex Ross, &ldquo;The Wanderer,&rdquo; The New Yorker, 1999'},
{id:'jd4', cat:'the dropped &ldquo;and&rdquo;', s:'“He is like a God who spends four hours on the shading on Eve’s upper lip<b>, forgets</b> to give her a clitoris.”',
 q:'Is the comma before “forgets” a splice?', o:['No — both verbs share one subject','Yes — a textbook splice','A typo for a period','A comma setting off an aside'], a:0,
 w:'No. “Spends” and “forgets” belong to the same “who” — one doer, two verbs — so no new sentence starts at the comma. The “and” that should sit between the verbs was cut. The sentence forgets its “and” right where God forgets the important part.',
 at:'Patricia Lockwood, &ldquo;Malfunctioning Sex Robot,&rdquo; LRB, 2019'},
{id:'jd5', cat:'pivot words', s:'“<b>Maybe,</b> but he also plays more than a hundred shows a year…”',
 q:'“Maybe” has no verb. Error or choice?', o:['A choice — a spoken shrug on the page','An error — a fragment','An error — a splice','A description with no owner'], a:0,
 w:'A choice. “Maybe” stands in for a whole sentence (“maybe that’s true”), and “but” turns the corner. We talk like this all the time; on the page it reads as: fine, granted — now here’s my point.',
 at:'Alex Ross, &ldquo;The Wanderer,&rdquo; The New Yorker, 1999'},
{id:'jd6', cat:'restrictive clauses', s:'“Every journalist <b>who is not too stupid or too full of himself to notice what is going on</b> knows that what he does is morally indefensible.”',
 q:'Why no commas around the “who” clause?', o:['No commas — the clause narrows which ones','An oversight in editing','Commas are optional here','The clause is too long for commas'], a:0,
 w:'Without commas, the clause pins down WHICH journalists: only the ones smart enough to notice. That quietly implies there are journalists too dumb or too vain to notice. Add commas and it becomes a bland statement about all journalists — the insult disappears.',
 at:'Janet Malcolm, The Journalist and the Murderer, 1990'},
{id:'jd7', cat:'appositives', s:'“It’s pure Tucker Carlson<b>, a move</b> I’ve seen hundreds of times in the over 40 hours of Tucker Carlson Tonight clips I’ve watched on Fox News in recent months.”',
 q:'Splice?', o:['No — a label for what he just did','Yes — a comma splice after “Carlson”','A fragment error','A run-on sentence'], a:0,
 w:'No. “A move I’ve seen hundreds of times” isn’t a new statement — it’s a label stuck onto what he just did (an appositive). The test: could the part after the comma stand alone as a sentence? Here it can’t, so no splice.',
 at:'Lyz Lenz, &ldquo;The Mystery of Tucker Carlson,&rdquo; Columbia Journalism Review, 2018'},
{id:'jd8', cat:'commas', s:'“<b>God,</b> she could be insulting to people.”',
 q:'What is “God” doing?', o:['An exclamation parked before the sentence','Acting as the sentence’s subject','Splicing two statements','Nothing grammatical at all'], a:0,
 w:'“God” is an exclamation parked out front, set off by a comma — always allowed. What matters is the sound: for one word, the critic stops sounding like a critic and sounds like an exasperated friend. That’s the whole essay’s relationship to Sontag, in one word.',
 at:'Terry Castle, &ldquo;Desperately Seeking Susan,&rdquo; London Review of Books, 2003'},
{id:'jd9', cat:'judgment calls', s:'“Asma al-Assad is glamorous, young, and very chic<b>—the freshest and most magnetic of first ladies</b>.”',
 q:'The grammar is clean. What failed?', o:['Nothing in the grammar — the judgment','The dash is used incorrectly','The comma before “and”','“Very chic” is a fragment'], a:0,
 w:'The list is clean, the dash is correct, the superlative appositive is well built. The failure is editorial: these are publicity terms for a dictator’s wife. The lesson: a sentence can be perfectly constructed and still be the thing that went wrong.',
 at:'Joan Juliet Buck, &ldquo;A Rose in the Desert,&rdquo; Vogue, 2011'},
{id:'jd10', cat:'clause joins', s:'“Later, she amended this <b>to say that</b> Maggie was <b>to take</b> her dead body to the mountains <b>so that</b> she could become food for bears.”',
 q:'Where does the deadpan come from?', o:['The stacked “to… so that…” clauses','The word “bears” at the end','A comma splice in the middle','A fragment at the end'], a:0,
 w:'From the grammar: “amended this to say that… was to take… so that she could become.” Each piece of the horror sits inside a subordinate clause — the sentence structure of instructions and forms. The sentence never raises its voice; the structure does the work.',
 at:'Taffy Brodesser-Akner, on Margot Kidder, The New York Times, 2018'},
{id:'fx1', cat:'splices', s:'“We smile when we see <b>him, we</b> laugh before he does anything; it makes us happy just to look at him.”',
 rw:'We smile when we see <b>him; we</b> laugh before he does anything; it makes us happy just to look at him.',
 q:'The first comma becomes a semicolon. What changed?', o:['Two observations instead of one reflex','Nothing — the meaning is identical','It became incorrect','The matching shapes broke'], a:0,
 w:'With the comma, the smiling and the laughing happen as one reflex. With the semicolon they become two tidy, separate observations. The fix is grammatically correct — and slower, which kills what the sentence was doing.',
 at:'Pauline Kael, &ldquo;The Man from Dream City,&rdquo; The New Yorker, 1975'},
{id:'fx2', cat:'lists', s:'“Joe Gould was an odd <b>and</b> penniless <b>and</b> unemployable little man who came to the city in 1916 and <b>ducked and dodged and held on</b> as hard as he could for over thirty-five years.”',
 rw:'Joe Gould was an odd<b>, penniless, and</b> unemployable little man who came to the city in 1916 and <b>ducked, dodged, and held on</b> as hard as he could for over thirty-five years.',
 q:'The extra &ldquo;ands&rdquo; become commas. What changed?', o:['The slowness went out of it','Nothing — it’s cleaner','A splice appeared','The verbs stopped matching'], a:0,
 w:'“Ducked, dodged, and held on” is a standard three-item list: quick to read. The repeated “and”s (polysyndeton) forced a pause between every item, so the sentence took longer to get through — its length acted out the thirty-five years. The edit removed that.',
 at:'Joseph Mitchell, &ldquo;Professor Sea Gull,&rdquo; The New Yorker, 1942'},
{id:'fx3', cat:'word order', s:'“<b>Dictator of a nation devoted to splendid sausages, cigars, beer, and babies,</b> Adolf Hitler is a vegetarian, teetotaller, nonsmoker, and celibate.”',
 rw:'Adolf Hitler, <b>dictator of a nation devoted to splendid sausages, cigars, beer, and babies,</b> is a vegetarian, teetotaller, nonsmoker, and celibate.',
 q:'The description moves behind the name. What changed?', o:['The description no longer precedes the name','Nothing; the phrase can go anywhere','A comma error was fixed','The appositive broke'], a:0,
 w:'In the original you read all the nation’s appetites before the name, so Hitler arrives already contradicted by his own country. With the name first, the same words read as a biographical note. The contrast depends on the order.',
 at:'Janet Flanner, &ldquo;F&uuml;hrer,&rdquo; The New Yorker, 1936'},
{id:'fx4', cat:'short sentences', s:'&ldquo;Gary Robinson died hungry.&rdquo;',
 rw:'Gary Robinson died hungry <b>that night, shot by a security guard after a dispute over fried chicken</b>.',
 q:'The rewrite spells out the story. What changed?', o:['The gap the reader filled in closed','It became more accurate','Nothing; fuller is better','The verb got weaker'], a:0,
 w:'The four-word version leaves the story out, and the reader supplies it — that supplying is where the force comes from. The rewrite states everything, so there is nothing left to do. Some sentences work by what they omit.',
 at:'Edna Buchanan&rsquo;s lede, in Calvin Trillin, &ldquo;Covering the Cops,&rdquo; The New Yorker, 1986'},
{id:'fx5', cat:'word order', s:'“Frank Sinatra, holding a glass of bourbon in one hand and a cigarette in the other, stood in a dark corner of the bar between two attractive but fading blondes who sat waiting for him to say something.”',
 rw:'Frank Sinatra held a glass of bourbon in one hand and a cigarette in the other<b>. He</b> stood in a dark corner of the bar between two attractive but fading blondes<b>. They</b> sat waiting for him to say something.',
 q:'One sentence becomes three. What changed?', o:['Everything stopped happening at once','It got clearer and more accurate','Nothing — the facts are identical','Details got lost in the split'], a:0,
 w:'The one long sentence holds Sinatra, the bourbon, the blondes, and the waiting inside a single grammatical frame — no period lets you stop until it’s all in place. Split into three sentences, the same facts arrive one at a time. The facts survive; the simultaneity doesn’t.',
 at:'Gay Talese, &ldquo;Frank Sinatra Has a Cold,&rdquo; Esquire, 1966'},
{id:'fx6', cat:'tense', s:'“We <b>would wear</b> shorts, big sneakers, and long, baggy T-shirts depicting famous athletes every single day, even in the winter.”',
 rw:'We <b>would have worn</b> shorts, big sneakers, and long, baggy T-shirts every single day, even in the winter.',
 q:'&ldquo;Would wear&rdquo; becomes &ldquo;would have worn.&rdquo; What changed?', o:['The routine became a closed past','Nothing; both are conditional','A tense error was fixed','The list broke'], a:0,
 w:'“Would wear” is conditional and habitual: inside the imagined marriage this happens over and over, and the imagining stays open. “Would have worn” is past conditional: the possibility is closed and unrealized. The tense of one verb decides whether the fantasy is ongoing or finished.',
 at:'Susan Orlean, &ldquo;The American Man at Age Ten,&rdquo; Esquire, 1992'},
{id:'fx7', cat:'word order', s:'“Like the credulous widow who wakes up one day to find the charming young man and all her savings gone, so the consenting subject of a piece of nonfiction writing learns—when the article or book appears—<b>his hard lesson</b>.”',
 rw:'The consenting subject of a piece of nonfiction writing learns <b>his hard lesson</b> when the article or book appears, like the credulous widow who wakes up one day to find the charming young man and all her savings gone.',
 q:'Same words, new order. What did the rewrite lose?', o:['The wait for the last three words','Nothing; the information is the same','A grammatical error was fixed','The widow comparison'], a:0,
 w:'Both versions say the same thing. But the original makes you read the whole con — widow, charming young man, savings gone — before it finally hands over “his hard lesson,” at the very end. The rewrite states the lesson in its first clause, and the widow trails behind as an afterthought. A sentence that saves its main point for the end is called a periodic sentence.',
 at:'Janet Malcolm, The Journalist and the Murderer, 1990'},
{id:'fx8', cat:'dashes', s:'“Clooney, who is unusual in being both very famous and, apparently, at ease with the fact<b>—he can sometimes look like a spokesman for celebrity itself—</b>was sitting on a long pale sofa, alongside Sarah Larson, his girlfriend.”',
 rw:'Clooney, who is unusual in being both very famous and, apparently, at ease with the fact, was sitting on a long pale sofa, alongside Sarah Larson, his girlfriend.',
 q:'The part between the dashes is cut. What changed?', o:['The idea of the whole profile went with it','Nothing; it was decoration','A splice was fixed','&ldquo;His girlfriend&rdquo; lost its comma'], a:0,
 w:'The part between the dashes — Clooney as “a spokesman for celebrity itself” — is the profile’s whole idea, planted in the first sentence. Cut it and all you have is a man on a sofa.',
 at:'Ian Parker, &ldquo;Somebody Has to Be in Control,&rdquo; The New Yorker, 2008'}
];


const BASICS = [
{id:'ba1', cat:'subject &amp; verb', s:'&ldquo;Gary Robinson died hungry.&rdquo;',
 q:'Subject + verb = a complete statement. Where are they here?', o:['&ldquo;Gary Robinson&rdquo; + &ldquo;died&rdquo;','&ldquo;died&rdquo; + &ldquo;hungry&rdquo;','&ldquo;Gary Robinson&rdquo; + &ldquo;hungry&rdquo;','There isn’t one'], a:0,
 w:'“Died” says what happened and when; “Gary Robinson” is who did it. Subject + verb: a complete sentence, at any length. “Hungry” just describes his state at the end.',
 at:'Edna Buchanan’s lede, in Calvin Trillin, “Covering the Cops,” The New Yorker, 1986'},
{id:'ba2', cat:'participles', s:'&ldquo;Frank Sinatra, holding a glass of bourbon in one hand and a cigarette in the other, stood in a dark corner of the bar&hellip;&rdquo;',
 q:'Which word is the verb — the one that says what happened?', o:['stood','holding','Sinatra','bourbon'], a:0,
 w:'“Stood” says what happened. “Holding” never says when — it’s a description of Sinatra (a participle), not the sentence’s verb. First find the word that says what happened; then find who did it.',
 at:'Gay Talese, “Frank Sinatra Has a Cold,” Esquire, 1966'},
{id:'ba3', cat:'clause joins', s:'&ldquo;It is raining, and Mikhail Baryshnikov is standing in a courtyard in Riga, the capital of Latvia, pointing up at two corner windows&hellip;&rdquo;',
 q:'How many complete statements?', o:['Two — “it is” and “Baryshnikov is standing”','One — the “and” merges them','Three — “pointing” makes a third','Four — count every -ing word'], a:0,
 w:'Two subject-verb pairs: “it is” and “Baryshnikov is standing.” “Pointing” never says when — it’s description (a participle) — and “the capital of Latvia” has no verb at all. Count the pairs and the sentence opens up.',
 at:'Joan Acocella, “The Soloist,” The New Yorker, 1998'},
{id:'ba4', cat:'participles', s:'&ldquo;He is a kind of confidence man, preying on people’s vanity, ignorance, or loneliness, gaining their trust and betraying them without remorse.&rdquo;',
 q:'Which of these is the sentence’s working verb — the one that says when?', o:['is','preying','gaining','betraying'], a:0,

{id:'ba5', cat:'splices', s:'&ldquo;We smile when we see him, we laugh before he does anything; it makes us happy just to look at him.&rdquo;',

 w:'Five verbs, but “when we see him” and “before he does anything” are pinned by their opening words — they can’t stand alone. The three free-standing statements are what the comma and semicolon have to manage.',

{id:'ba7', cat:'appositives', s:'&ldquo;It’s late already, five or five-thirty.&rdquo;',

const $ = id => document.getElementById(id);
let misses = {}; try { misses = JSON.parse(localStorage.getItem('splice-misses2') || '{}'); } catch(e){}
function saveMisses(){ try { localStorage.setItem('splice-misses2', JSON.stringify(misses)); } catch(e){} }
let saved = []; try { saved = JSON.parse(localStorage.getItem('splice-saved2') || '[]'); } catch(e){}
function persistSaved(){ try { localStorage.setItem('splice-saved2', JSON.stringify(saved)); } catch(e){} }

let mode = 'all'; // all | miss | saved | basics | moves | lines | gloss
let deck = [], pos = 0, right = 0, answered = 0, streak = 0, locked = false;
let wrong = {}, runMode = 'all';
const QUIZ = ['all','miss','practice'];

const ALL = () => DATA.concat(BASICS);
const BYID = {}; ALL().forEach(d => BYID[d.id] = d);
function saveRun(){
  if (QUIZ.indexOf(runMode) === -1) return;
  try { localStorage.setItem('cr-run:' + runMode, JSON.stringify({ids:deck.map(d=>d.id), pos:pos, right:right, answered:answered, streak:streak, wrong:wrong})) } catch(e){}
}
function clearRun(m){ try { localStorage.removeItem('cr-run:' + m) } catch(e){} }
function loadRun(m){
  try {
    const r = JSON.parse(localStorage.getItem('cr-run:' + m) || 'null');
    if (r && r.ids && r.pos < r.ids.length){
      const cards = r.ids.map(id => BYID[id]).filter(Boolean);
      if (cards.length === r.ids.length) return {cards:cards, r:r};
    }
  } catch(e){}
  return null;
}
function missTotal(){ return ALL().filter(d => (misses[d.id]||0) > 0).length; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function newDeck(fresh){
  if (mode === 'saved'){ paint(); renderSaved(); return; }
  if (mode === 'moves'){ paint(); renderMoves(); return; }
  if (mode === 'gloss'){ paint(); renderGloss(); return; }
  if (mode === 'lines'){ paint(); renderLines(); return; }
  if (mode === 'basics'){ paint(); renderBasics(); return; }
  if (mode === 'flash'){ paint(); startFlash(); return; }
  runMode = mode;
  if (!fresh){
    const got = loadRun(mode);
    if (got){
      deck = got.cards; pos = got.r.pos; right = got.r.right;
      answered = got.r.answered; streak = got.r.streak; wrong = got.r.wrong || {};
      paint(); render(); return;
    }
  }
  const pool = mode === 'miss' ? ALL().filter(d => (misses[d.id]||0) > 0)
    : mode === 'practice' ? BASICS.slice() : DATA.slice();
  deck = shuffle(pool); pos = 0; right = 0; answered = 0; streak = 0; wrong = {};
  clearRun(mode); saveRun();
  paint(); render();
}
function paint(){
  $('scoreline').textContent = answered ? ((runMode === 'miss' ? 'misses \u00b7 ' : runMode === 'practice' ? 'practice \u00b7 ' : '') + right + ' of ' + answered + ' right') : 'no answers yet';
  const box = $('modes'); box.innerHTML = '';
  const mk = (label, key, disabled) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = label;
    b.setAttribute('aria-pressed', String(mode === key));
    b.disabled = !!disabled;
    b.onclick = () => { mode = (mode === key && key !== 'all') ? 'all' : key; flashActive = false; newDeck(); };
    box.appendChild(b);
  };
  mk('Basics', 'basics');
  mk('Practice', 'practice');
  mk('Flashcards', 'flash');
  mk('Drill', 'all');
  mk('Moves', 'moves');
  mk('Lines', 'lines');
  mk('Glossary', 'gloss');
  mk('My misses (' + missTotal() + ')', 'miss', missTotal() === 0 && mode !== 'miss');
  mk('Saved (' + saved.length + ')', 'saved', saved.length === 0 && mode !== 'saved');
}
function stripTags(h){ const t = document.createElement('span'); t.innerHTML = h; return t.textContent; }

function render(){
  const stage = $('stage');
  if (!deck.length){
    stage.innerHTML = '<div class="card done"><h2>Nothing here,</h2><p>' +
      (mode === 'miss' ? 'No standing misses.' : 'No cards.') + '</p></div>';
    return;
  }
  if (pos >= deck.length) return renderDone();
  const d = deck[pos]; locked = false;
  const order = shuffle(d.o.map((_,i)=>i));
  const card = document.createElement('div'); card.className = 'card';
  const body = d.rw
    ? '<p class="fixlabel">The original</p><p class="sentence">' + d.s + '</p>' +
      '<p class="fixlabel">An editor&rsquo;s rewrite</p><p class="sentence rwtext">' + d.rw + '</p>'
    : '<p class="sentence">' + d.s + '</p>';
  card.innerHTML =
    '<div class="eyebrow">' + (pos+1) + ' of ' + deck.length + '</div>' +
    body +
    '<p class="prompt">' + d.q + '</p>' +
    '<div class="opts">' + order.map((oi,p) =>
      '<button class="opt" data-i="' + oi + '"><span class="key">' + (p+1) + '</span><span>' + d.o[oi] + '</span></button>').join('') + '</div>' +
    '<div id="verdict"></div>' +
    '<div class="actions"><span class="hint">1&ndash;' + d.o.length + ' answer &middot; enter next</span>' +
    '<button class="next" id="nextbtn" disabled>Next</button></div>';
  stage.innerHTML = ''; stage.appendChild(card);
  card.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(parseInt(b.dataset.i,10)));
  $('nextbtn').onclick = advance;
}
function answer(i){
  if (locked) return; locked = true;
  const d = deck[pos];
  const ok = i === d.a;
  answered++;
  if (ok){ right++; streak++;
    if (misses[d.id]){ delete misses[d.id]; saveMisses(); }
  } else { streak = 0; misses[d.id] = (misses[d.id]||0) + 1; saveMisses();
    if (d.cat) wrong[d.cat] = (wrong[d.cat]||0) + 1; }
  saveRun();
  document.querySelectorAll('.opt').forEach(b => {
    const bi = parseInt(b.dataset.i,10);
    b.disabled = true;
    b.dataset.state = bi === d.a ? 'right' : (bi === i ? 'wrong' : 'dim');
  });
  const v = $('verdict');
  v.innerHTML = '<div class="verdict' + (ok?'':' bad') + '"><p class="call">' + (ok ? 'Right' : 'No &mdash; ' + stripTags(d.o[d.a])) + '</p>' +
    '<p class="why">' + d.w + '</p><p class="att">&mdash; ' + d.at + '</p></div>';
  glossify(v.querySelector('.why'));
  const sv = document.createElement('button'); sv.className = 'savebtn';
  const paintSv = () => { const on = saved.indexOf(d.id) !== -1; sv.textContent = on ? '&check; saved'.replace('&check;','✓') + ' for lesson plans' : 'Save for lesson plans'; sv.dataset.on = String(on); };
  paintSv();
  sv.onclick = () => { const at = saved.indexOf(d.id); if (at === -1) saved.push(d.id); else saved.splice(at,1); persistSaved(); paintSv(); paint(); };
  v.firstElementChild.appendChild(sv);
  $('nextbtn').disabled = false;
  paint();
  $('nextbtn').focus({preventScroll:true});
}
function advance(){ pos++; saveRun(); render(); }
function renderDone(){
  clearRun(runMode);
  const pct = answered ? Math.round(100*right/answered) : 0;
  const tally = Object.keys(wrong).map(k => [k, wrong[k]]).sort((a,b) => b[1]-a[1]).slice(0,3);
  const breakdown = tally.length
    ? '<div class="eyebrow" style="margin:14px 0 0">missed: ' + tally.map(t => t[0] + ' (' + t[1] + ')').join(' &middot; ') + '</div>'
    : '';
  $('stage').innerHTML = '<div class="card done"><h2>' + right + ' of ' + answered + ' &mdash; ' + pct + '%</h2>' +
    '<p>' + (missTotal() ? missTotal() + ' card' + (missTotal()>1?'s':'') + ' waiting in My misses.' : 'No standing misses.') + '</p>' +
    breakdown +
    '<button class="next" id="againbtn">Run it again</button></div>';
  $('againbtn').onclick = () => newDeck(true);
  $('againbtn').focus({preventScroll:true});
}
function itemToMd(d){
  let md = '> ' + stripTags(d.s) + '\n' + (d.rw ? '\n**An editor\u2019s rewrite:** ' + stripTags(d.rw) + '\n' : '') + '\n**Ask:** ' + stripTags(d.q) + '\n\n';
  d.o.forEach((o,i) => { md += '- ' + stripTags(o) + (i === d.a ? '  ✓' : '') + '\n'; });
  md += '\n' + stripTags(d.w) + '\n\n— ' + stripTags(d.at) + '\n';
  return md;
}
function copyText(txt, btn){
  const done = () => { const old = btn.textContent; btn.textContent = '✓ Copied'; setTimeout(()=>{ btn.textContent = old; }, 1400); };
  const fb = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){ btn.textContent = 'Copy failed'; }
    document.body.removeChild(ta); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fb); else fb();
}

{k:'sentence', t:'sentence', d:'Tells you that someone or something did something, and closes with a period. At minimum: a subject and a verb.', ex:'“Gary Robinson died hungry.”'},

{k:'verb', t:'verb', d:'The word that says what happened and when: died, is, stood. Every complete statement needs one.', ex:'“stood” in the Sinatra lede.'},
{k:'statement', t:'complete statement (clause)', d:'A subject plus a verb that could stand alone as a sentence. Grammars call this a clause.', ex:'“It is raining.”'},
{k:'fragment', t:'fragment', d:'Less than a complete statement — no verb, or no subject — wearing a period. Sometimes an error, sometimes chosen — the sound of the last word.', ex:'“Penis with a thesaurus.” — DFW on Updike, quoted by Lockwood'},
{k:'splice', t:'comma splice', d:'Two complete statements held together by only a comma. That job normally needs “and,” a semicolon, or a period. Writers sometimes do it on purpose, for speed.', ex:'“We smile when we see him, we laugh before he does anything…” — Kael'},
{k:'runon', t:'run-on', d:'Two complete statements with nothing at all between them — not even a comma.', ex:'(constructed) “He talked for an hour he never mentioned the record.”'},
{k:'semicolon', t:'semicolon', d:'Joins two complete statements without “and.” Second job: separates list items that have commas inside them.', ex:'“Merle stares a lot; onstage… he can seem oblivious of the audience.” — Di Salvatore'},

{k:'pinned', t:'pinned clause (subordinate)', d:'Has its own subject and verb, but its first word — when, before, because, that — pins it to another statement, so it can’t stand alone.', ex:'“when we see him” — Kael'},
{k:'restrictive', t:'restrictive vs. aside', d:'No commas: the clause narrows down which one (“the record that broke him”). With commas: the noun is already known and the clause is a liftable aside (“the record, which broke him,”).', ex:'Malcolm’s comma-less “who is not too stupid…” narrows which journalists.'},
{k:'interjection', t:'interjection', d:'An exclamation parked outside the sentence, set off by a comma.', ex:'“God, she could be insulting to people.” — Castle'},
{k:'compoundpred', t:'compound predicate', d:'One subject with a chain of verbs. The commas between the verbs are list commas, not joins — so it isn’t a splice chain.', ex:'“He swallows gruel…, is fond of oatmeal, digests…” — Flanner'},
{k:'anaphora', t:'anaphora', d:'Sentences or phrases in a row opening with the same words — repetition as a drumbeat.', ex:'“He had some coffee. He read the newspaper. He dipped into…” — MacFarquhar'},
{k:'epistrophe', t:'epistrophe', d:'Ending several sentences or phrases on the same word — the mirror image of anaphora, where the openings repeat.', ex:'“…combined. It is more than… combined.” — Di Salvatore'},
{k:'asyndeton', t:'asyndeton', d:'Leaving out the “and” where you would expect one, letting a comma carry the join. It makes the list quick and clipped.', ex:'“We interpret what we see, select the most workable…” — Didion'},
{k:'polysyndeton', t:'polysyndeton', d:'Putting “and” between every item in a list, where normal writing would use commas. It slows the sentence down and makes you take the items one at a time.', ex:'“odd and penniless and unemployable… ducked and dodged and held on” — Mitchell'},
{k:'tricolon', t:'tricolon', d:'A three-beat pattern — three phrases or statements built the same way.', ex:'“a light will flash on, a window will open, and a Coke bottle will come flying” — Talese'},
{k:'periodic', t:'periodic sentence', d:'A sentence that saves its main statement for the very end — everything stacks up first, then the payoff lands.', ex:'Malcolm’s widow sentence, ending “…his hard lesson.”'}
];
const GLOSSMAP = {}; GLOSS.forEach(g => GLOSSMAP[g.k] = g);
const TERMRE = new RegExp('\\b(' + [
 'comma splices?','compound predicates?','conjunctive adverbs?','periodic sentences?','pivot words?',
 'polysyndeton','asyndeton','epistrophe','anaphora','tricolons?','interjections?',
 'semicolons?','appositives?','modifiers?','participles?','gerunds?','fragments?','splices?','run-ons?','restrictive','nonrestrictive','colons?','dash(?:es)?'
].join('|') + ')\\b', 'gi');
function termKey(m){
  const s = m.toLowerCase();
  if (s.startsWith('comma splice') || s.startsWith('splice')) return 'splice';
  if (s.startsWith('compound')) return 'compoundpred';
  if (s.startsWith('conjunctive') || s.startsWith('pivot')) return 'pivotword';
  if (s.startsWith('periodic')) return 'periodic';
  if (s.startsWith('run-on')) return 'runon';
  if (s.startsWith('semicolon')) return 'semicolon';
  if (s.startsWith('appositive')) return 'appositive';
  if (s.startsWith('modifier')) return 'modifier';
  if (s.startsWith('participle')) return 'participle';
  if (s.startsWith('gerund')) return 'gerund';
  if (s.startsWith('fragment')) return 'fragment';
  if (s.startsWith('restrictive') || s.startsWith('nonrestrictive')) return 'restrictive';
  if (s.startsWith('colon')) return 'colon';
  if (s.startsWith('dash')) return 'dash';
  return {'polysyndeton':'polysyndeton','asyndeton':'asyndeton','epistrophe':'epistrophe','anaphora':'anaphora','interjection':'interjection'}[s.replace(/s$/,'')] || (s.startsWith('tricolon') ? 'tricolon' : null);
}
function glossify(el){
  if (!el) return;
  el.innerHTML = el.innerHTML.replace(TERMRE, m => {
    const k = termKey(m);
    return k && GLOSSMAP[k] ? '<span class="hov gterm" tabindex="0" data-g="' + k + '">' + m + '</span>' : m;
  });
  hookTips(el);
}
function hookTips(root){
  root.querySelectorAll('.hov').forEach(el => {
    if (el.dataset.hooked) return; el.dataset.hooked = '1';
    const fill = () => {
      if (el.dataset.g){ const g = GLOSSMAP[el.dataset.g]; el.dataset.t = g.t; el.dataset.x = g.d + (g.ex ? ' <i>' + g.ex + '</i>' : ''); }
    };
    el.addEventListener('mouseenter', () => { if (!tipPinned){ fill(); showTip(el); } });
    el.addEventListener('mouseleave', () => { if (!tipPinned) hideTip(); });
    el.addEventListener('focus', () => { fill(); showTip(el); });
    el.addEventListener('blur', hideTip);
    el.addEventListener('click', (e) => {
      e.stopPropagation(); fill();
      if (tipPinned === el){ hideTip(); return; }
      document.querySelectorAll('.hov.on').forEach(x=>x.classList.remove('on'));
      el.classList.add('on'); tipPinned = el; showTip(el);
    });
  });
}
const tip = () => document.getElementById('tip');
let tipPinned = null;
function showTip(el){
  const t = tip();
  t.innerHTML = '<b>' + el.dataset.t + '</b>' + el.dataset.x;
  t.style.display = 'block';
  const r = el.getBoundingClientRect(), tr = t.getBoundingClientRect();
  let x = r.left, y = r.bottom + 8;
  if (x + tr.width > window.innerWidth - 12) x = window.innerWidth - tr.width - 12;
  if (y + tr.height > window.innerHeight - 12) y = r.top - tr.height - 8;
  t.style.left = Math.max(8,x) + 'px'; t.style.top = Math.max(8,y) + 'px';
}
function hideTip(){ tip().style.display = 'none'; document.querySelectorAll('.hov.on').forEach(e=>e.classList.remove('on')); tipPinned = null; }

function moveToMd(m){
  let md = '## ' + m.name + '\n\n' + stripTags(m.d) + '\n\n';
  m.ex.forEach(e => { md += '> ' + stripTags(e.s) + '\n> — ' + stripTags(e.at) + '\n\n' + (e.n ? stripTags(e.n) + '\n\n' : ''); });
  return md;
}
function renderMoves(){
  const stage = $('stage'); stage.innerHTML = '';
  MOVES.forEach((m, i) => {
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML =
      '<p class="mv-name">' + m.name + '</p>' +
      '<p class="mv-def">' + m.d + '</p>' +
      m.ex.map(e => '<p class="mvq">' + e.s + '</p>' + (e.n ? '<p class="mv-note">' + e.n + '</p>' : '') + '<p class="mv-cite">— ' + e.at + '</p>').join('');
    glossify(card.querySelector('.mv-def'));
    card.querySelectorAll('.mv-note').forEach(glossify);
    stage.appendChild(card);
  });
}
function lineToMd(l){
  return '> ' + stripTags(l.s.replace(/<br>/g, ' / ')) + '\n> — ' + stripTags(l.at) + '\n\n' + stripTags(l.n) + '\n\n';
}
function renderLines(){
  const stage = $('stage'); stage.innerHTML = '';
  LINES.forEach((l, i) => {
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML =
      '<p class="mvq">' + l.s + '</p>' +
      '<p class="mv-note">' + l.n + '</p>' +
      '<p class="mv-cite">— ' + l.at + '</p>';
    card.querySelectorAll('.mv-note').forEach(glossify);
    stage.appendChild(card);
  });
}
function renderGloss(){
  const stage = $('stage');
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = '<div class="eyebrow">Glossary</div>' +
    GLOSS.map(g => '<div class="g-row"><p class="g-term">' + g.t + '</p><p class="g-def">' + g.d + '</p>' +
      (g.ex ? '<p class="g-ex">' + g.ex + '</p>' : '') + '</div>').join('');
  stage.innerHTML = ''; stage.appendChild(card);
}
let flashQueue = [], flashFlipped = false, flashTotal = 0, flashActive = false;
function startFlash(){
  flashQueue = shuffle(GLOSS.slice()); flashTotal = flashQueue.length;
  flashActive = true; flashFlipped = false; renderFlash();
}
function renderFlash(){
  const stage = $('stage');
  if (!flashQueue.length){
    flashActive = false;
    stage.innerHTML = '<div class="card done"><h2>All ' + flashTotal + ' terms,</h2><p>Run them again, or switch to Practice.</p>' +
      '<button class="next" id="againbtn">Run them again</button></div>';
    $('againbtn').onclick = () => { startFlash(); };
    $('againbtn').focus({preventScroll:true});
    return;
  }
  const g = flashQueue[0];
  const card = document.createElement('div'); card.className = 'card'; card.id = 'flipcard';
  if (!flashFlipped){
    card.style.cursor = 'pointer';
    card.innerHTML = '<div class="eyebrow">Flashcards &middot; ' + flashQueue.length + ' left</div>' +
      '<p class="sentence" style="font-size:clamp(24px,4vw,30px)">' + g.t + '</p>' +
      '<div class="actions"><span class="hint">click or space to flip</span></div>';
    card.onclick = flipFlash;
  } else {
    card.innerHTML = '<div class="eyebrow">Flashcards &middot; ' + flashQueue.length + ' left</div>' +
      '<p class="sentence" style="font-size:22px">' + g.t + '</p>' +
      '<p class="g-def" style="font-size:15px; margin-top:8px">' + g.d + '</p>' +
      (g.ex ? '<p class="g-ex">' + g.ex + '</p>' : '') +
      '<div class="opts" style="margin-top:18px">' +
      '<button class="opt" id="flagain"><span class="key">1</span><span>Again &mdash; show it to me later</span></button>' +
      '<button class="opt" id="flgot"><span class="key">2</span><span>Got it</span></button></div>';
  }
  stage.innerHTML = ''; stage.appendChild(card);
  if (flashFlipped){
    $('flagain').onclick = () => { const g2 = flashQueue.shift(); flashQueue.splice(Math.min(3, flashQueue.length), 0, g2); flashFlipped = false; renderFlash(); };
    $('flgot').onclick = () => { flashQueue.shift(); flashFlipped = false; renderFlash(); };
  }
}
function flipFlash(){ flashFlipped = true; renderFlash(); }
function renderBasics(){
  const stage = $('stage');
  const card = document.createElement('div'); card.className = 'card';
  let h = '<div class="eyebrow">Basics</div>' +
    '<p class="why" style="font-size:15px">A sentence tells you that someone or something did something. The someone is the <strong>subject</strong>; the did-something is the <strong>verb</strong> — the word that says what happened and when (died, is, stood). Subject plus verb makes a <strong>complete statement</strong> (grammars call this a clause), and a sentence can hold one statement or several.</p>' +
    '<p class="why" style="font-size:15px; margin-top:8px">Everything else in a sentence is doing one of three jobs. <strong>Modifying</strong> (describing): adding to a noun or a verb without making a new statement — grammars call these modifiers — &ldquo;holding a glass of bourbon,&rdquo; &ldquo;in a dark corner.&rdquo; <strong>Renaming</strong>: setting a second name beside a noun — &ldquo;Riga, the capital of Latvia.&rdquo; <strong>Joining</strong>: holding statements together — with &ldquo;and,&rdquo; a semicolon, a colon, a dash, or (against the usual rule) a bare comma. To read a sentence closely: find the verb, find its subject, then ask what job every remaining piece is doing. The full set of terms, each with an example from the readings, is under Glossary.</p>' +
    '<p class="why" style="margin-top:8px; color:var(--muted)">' + EX.length + ' sentences from the readings. Hover over (or tap) any underlined part to see what it is and what it’s doing.</p>';
  for (const ex of EX){
    h += '<div class="ex"><p class="sentence">';
    for (const p of ex.parts){
      if (p.length === 1) h += p[0];
      else h += '<span class="hov" tabindex="0" data-t="' + p[1] + '" data-x="' + p[2].replace(/"/g,'&quot;') + '">' + p[0] + '</span>';
    }
    h += '</p><p class="ex-cite">— ' + ex.cite + '</p></div>';
  }


  card.innerHTML = h;
  stage.innerHTML = ''; stage.appendChild(card);
  hookTips(card);
  document.addEventListener('click', hideTip);
}
function renderSaved(){
  const stage = $('stage');
  const items = saved.map(id => ALL().find(d => d.id === id)).filter(Boolean);
  if (!items.length){ stage.innerHTML = '<div class="card done"><h2>Nothing saved,</h2><p>Answer a card, then save it here.</p></div>'; return; }
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = '<div class="sv-head"><span class="eyebrow" style="margin:0">Saved &middot; ' + items.length + '</span>' +
    '<button class="copyall" id="copyall">Copy all as Markdown</button></div>' +
    items.map(d => '<div class="sv-item" data-id="' + d.id + '">' +
      '<p class="sentence">' + d.s + '</p>' +
      (d.rw ? '<p class="fixlabel">An editor&rsquo;s rewrite</p><p class="sentence rwtext" style="font-size:17px">' + d.rw + '</p>' : '') +
      '<p class="sv-meta">' + d.at + '</p>' +
      '<p class="sv-why">' + d.w + '</p>' +
      '<div class="sv-actions"><button class="mini sv-copy">Copy</button><button class="mini sv-del">Remove</button></div></div>').join('');
  stage.innerHTML = ''; stage.appendChild(card);
  $('copyall').onclick = e => copyText(items.map(itemToMd).join('\n---\n\n'), e.target);
  card.querySelectorAll('.sv-item').forEach(el => {
    const d = ALL().find(x => x.id === el.dataset.id);
    el.querySelector('.sv-copy').onclick = e => copyText(itemToMd(d), e.target);
    el.querySelector('.sv-del').onclick = () => { saved = saved.filter(x => x !== d.id); persistSaved(); paint(); renderSaved(); };
  });
}
document.addEventListener('keydown', e => {
  if (flashActive && !flashFlipped && (e.key === ' ' || e.key === 'Enter')){
    if ($('flipcard')){ e.preventDefault(); flipFlash(); return; }
  }
  if (e.key === 'Enter'){
    const n = $('nextbtn'), a = $('againbtn');
    if (n && !n.disabled){ e.preventDefault(); advance(); }
    else if (a){ e.preventDefault(); newDeck(); }
    return;
  }
  const k = parseInt(e.key,10);
  if (k >= 1 && k <= 4 && !locked){
    const btns = document.querySelectorAll('.opt');
    if (btns[k-1] && !btns[k-1].disabled){ e.preventDefault(); btns[k-1].click(); }
  }
});
if (!loadRun('all')){
  if (loadRun('miss') && missTotal()) mode = 'miss';
  else if (loadRun('practice')) mode = 'practice';
}
newDeck();
</script>
